<!DOCTYPE html>
<html lang="en" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrono Studio</title>

<meta name="description" content="A private, on-device timeline of your life.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self';
  font-src 'self';
  manifest-src 'self';
  worker-src 'self';
  connect-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
  object-src 'none';
">
<meta name="theme-color" content="#0C0E16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chrono">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<script>
/* Theme is applied before first paint so the app never flashes the wrong ground. */
(function(){
  // Reads exactly one key, its own. Never enumerates the shared store.
  var ok = ['studio','graphite','sea','forest','blossom','ink','midnight','noir'], t = null;
  try { t = localStorage.getItem('chrono.theme.v1'); } catch(e){}
  document.documentElement.setAttribute('data-theme', ok.indexOf(t) >= 0 ? t : 'studio');
})();
</script>

<style>
/* Optional self-hosted font. Drop ComicNeue-Regular.woff2 and ComicNeue-Bold.woff2
   into a /fonts folder and this activates automatically. If the files are absent
   the browser silently falls through to the next family in --f. Nothing is ever
   fetched from a third party, by design. */
@font-face{
  font-family:"Comic Neue";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/ComicNeue-Regular.woff2") format("woff2");
}
@font-face{
  font-family:"Comic Neue";font-style:normal;font-weight:700;font-display:swap;
  src:url("fonts/ComicNeue-Bold.woff2") format("woff2");
}

/* ============================================================
   CHRONO STUDIO — ink & handwriting
   Palette
     --bg      #0C0E16  page ground
     --surface    #151A29  raised surface
     --text    #EDF0F8  primary type
     --text-2    #858CA6  secondary type
     inks: sky #7FD1FF · mint #6EE7A8 · amber #FFC46B · rose #FF9BB3
   ============================================================ */

/* ============================================================
   THEMES
   Every colour in the app resolves through these tokens, so a
   theme is a token set and nothing else. Swap data-theme on
   <html> and the whole app follows, including the diary paper.
   ============================================================ */
:root{
  --r-md:16px; --r-lg:22px; --r-xl:30px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --kb:0px;
  --head-h:200px;   /* replaced with the real measurement on first render */
  --f: "Comic Sans MS","Comic Neue","Chalkboard SE","Chalkboard","Bradley Hand",ui-rounded,system-ui,cursive;
}

/* ---- Studio: warm cream, ink brown, terracotta. Editorial and calm. ---- */
/* Also bound to :root so the app is never left without colours if the
   data-theme attribute goes missing for any reason. */
:root, [data-theme="studio"]{
  color-scheme:light;
  --bg:#F4F0E8; --surface:#FFFDF9; --surface-2:#EBE4D7;
  --text:#211E19; --text-2:#6B6357; --text-3:#9C9384;
  --line:rgba(33,30,25,.10); --line-2:rgba(33,30,25,.20);
  --accent:#C25733; --accent-2:#E0904A; --on-accent:#FFF9F3;
  --c2:#1F7A6B; --c3:#3B6FB5; --c4:#A8582A;
  --shadow-head:0 6px 18px rgba(60,50,35,.07);
  --edge:inset 0 1px 0 rgba(255,255,255,.7);
  --scrim:rgba(45,38,30,.34);
  --shadow-card:0 1px 2px rgba(60,50,35,.05);
  --shadow-pop:0 12px 30px rgba(60,50,35,.16);
  --glow:rgba(194,87,51,.22);
  --danger:#C0392B; --danger-bg:rgba(192,57,43,.09); --danger-line:rgba(192,57,43,.28);
  --paper-a:#FFFDF6; --paper-b:#EDE4CE; --paper-text:#2A2620; --paper-sub:#8A7F63; --paper-margin:rgba(200,80,80,.30);
}

/* ---- Sea glass: cool mist, deep navy, clear blue. Fresh and crisp. ---- */
[data-theme="sea"]{
  color-scheme:light;
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#DFE7F1;
  --text:#152033; --text-2:#586880; --text-3:#8B97AC;
  --line:rgba(21,32,51,.09); --line-2:rgba(21,32,51,.18);
  --accent:#2E6FE0; --accent-2:#3FB6D8; --on-accent:#FFFFFF;
  --c2:#E0603C; --c3:#12A085; --c4:#7C5CD6;
  --shadow-head:0 6px 18px rgba(20,35,60,.07);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(15,25,40,.36);
  --shadow-card:0 1px 2px rgba(20,35,60,.05);
  --shadow-pop:0 12px 30px rgba(20,35,60,.18);
  --glow:rgba(46,111,224,.24);
  --danger:#D64545; --danger-bg:rgba(214,69,69,.09); --danger-line:rgba(214,69,69,.28);
  --paper-a:#FFFFFF; --paper-b:#DCE5F0; --paper-text:#1A2436; --paper-sub:#7C8AA0; --paper-margin:rgba(214,69,69,.28);
}

/* ---- Blossom: blush and lavender, candy accents. Soft and playful. ---- */
[data-theme="blossom"]{
  color-scheme:light;
  --bg:#FAF3F7; --surface:#FFFFFF; --surface-2:#F3E7EF;
  --text:#2B1E29; --text-2:#796373; --text-3:#A794A3;
  --line:rgba(43,30,41,.09); --line-2:rgba(43,30,41,.18);
  --accent:#D14D8A; --accent-2:#9B6BD6; --on-accent:#FFFFFF;
  --c2:#3FA98C; --c3:#E0952F; --c4:#5B8FD6;
  --shadow-head:0 6px 18px rgba(60,30,50,.07);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(40,25,38,.34);
  --shadow-card:0 1px 2px rgba(60,30,50,.05);
  --shadow-pop:0 12px 30px rgba(60,30,50,.16);
  --glow:rgba(209,77,138,.24);
  --danger:#D6425F; --danger-bg:rgba(214,66,95,.09); --danger-line:rgba(214,66,95,.28);
  --paper-a:#FFFCFE; --paper-b:#EEDCE8; --paper-text:#2B1E29; --paper-sub:#9C8496; --paper-margin:rgba(214,66,95,.28);
}

/* ---- Graphite: cool neutral, near-black type, one vivid accent. ---- */
[data-theme="graphite"]{
  color-scheme:light;
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#E4E6EA;
  --text:#16181D; --text-2:#5C6068; --text-3:#8D929B;
  --line:rgba(22,24,29,.10); --line-2:rgba(22,24,29,.20);
  --accent:#E8552F; --accent-2:#FF8A5B; --on-accent:#FFFFFF;
  --c2:#1F7A8C; --c3:#2E8B57; --c4:#6B5BD6;
  --scrim:rgba(15,17,22,.38);
  --shadow-card:0 1px 2px rgba(20,22,28,.06);
  --shadow-pop:0 14px 34px rgba(20,22,28,.20);
  --shadow-head:0 6px 18px rgba(20,22,28,.08);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --glow:rgba(232,85,47,.26);
  --danger:#D6342A; --danger-bg:rgba(214,52,42,.09); --danger-line:rgba(214,52,42,.28);
  --paper-a:#FFFFFF; --paper-b:#E2E5EA; --paper-text:#16181D; --paper-sub:#82868F; --paper-margin:rgba(214,52,42,.26);
}

/* ---- Noir: high contrast, near-black ground, amber accent. ---- */
[data-theme="noir"]{
  color-scheme:dark;
  --bg:#08090B; --surface:#14161A; --surface-2:#1E2126;
  --text:#F7F8FA; --text-2:#9AA0AA; --text-3:#666C77;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --accent:#F5A524; --accent-2:#FFD166; --on-accent:#0B0C0E;
  --c2:#4EA8FF; --c3:#3FCF8E; --c4:#FF6B8A;
  --scrim:rgba(0,0,0,.66);
  --shadow-card:none;
  --shadow-pop:0 14px 34px rgba(0,0,0,.62);
  --shadow-head:0 6px 18px rgba(0,0,0,.5);
  --edge:inset 0 1px 0 rgba(255,255,255,.06);
  --glow:rgba(245,165,36,.30);
  --danger:#FF6B6B; --danger-bg:rgba(255,107,107,.11); --danger-line:rgba(255,107,107,.32);
  --paper-a:#F7F4EC; --paper-b:#E4DFD2; --paper-text:#1A1A1E; --paper-sub:#867F70; --paper-margin:rgba(200,80,80,.30);
}

/* ---- Forest: pale sage, deep green, warm gold. ---- */
[data-theme="forest"]{
  color-scheme:light;
  --bg:#EEF2ED; --surface:#FFFFFF; --surface-2:#DFE7DD;
  --text:#16201A; --text-2:#556157; --text-3:#8A968B;
  --line:rgba(22,32,26,.10); --line-2:rgba(22,32,26,.20);
  --accent:#1F7A4C; --accent-2:#59A85E; --on-accent:#FFFFFF;
  --c2:#C08A2E; --c3:#2E6FA8; --c4:#B0524A;
  --scrim:rgba(18,28,22,.36);
  --shadow-card:0 1px 2px rgba(25,45,32,.06);
  --shadow-pop:0 14px 34px rgba(25,45,32,.18);
  --shadow-head:0 6px 18px rgba(25,45,32,.08);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --glow:rgba(31,122,76,.24);
  --danger:#B33A3A; --danger-bg:rgba(179,58,58,.09); --danger-line:rgba(179,58,58,.28);
  --paper-a:#FFFFFF; --paper-b:#DEE6DC; --paper-text:#16201A; --paper-sub:#7E8A80; --paper-margin:rgba(179,58,58,.26);
}

/* ---- Midnight: deep indigo, electric cyan and violet. ---- */
[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#0A1020; --surface:#141C31; --surface-2:#1D2842;
  --text:#EAF0FF; --text-2:#8894B4; --text-3:#5A6584;
  --line:rgba(180,205,255,.10); --line-2:rgba(180,205,255,.20);
  --accent:#3DD5F3; --accent-2:#8B7BFF; --on-accent:#071021;
  --c2:#FF7BA9; --c3:#57E39B; --c4:#FFC670;
  --scrim:rgba(4,8,18,.66);
  --shadow-card:none;
  --shadow-pop:0 14px 34px rgba(0,0,0,.58);
  --shadow-head:0 6px 18px rgba(0,0,0,.45);
  --edge:inset 0 1px 0 rgba(255,255,255,.06);
  --glow:rgba(61,213,243,.28);
  --danger:#FF7B8F; --danger-bg:rgba(255,123,143,.11); --danger-line:rgba(255,123,143,.32);
  --paper-a:#F4F6FB; --paper-b:#DCE2EE; --paper-text:#141C31; --paper-sub:#7C87A0; --paper-margin:rgba(200,90,110,.30);
}

/* ---- Ink: the original dark. Kept for night reading. ---- */
[data-theme="ink"]{
  color-scheme:dark;
  --bg:#0C0E16; --surface:#151A29; --surface-2:#1D2436;
  --text:#EDF0F8; --text-2:#858CA6; --text-3:#5B6280;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --accent:#7FD1FF; --accent-2:#B79BFF; --on-accent:#0C0E16;
  --c2:#FF9BB3; --c3:#6EE7A8; --c4:#FFC46B;
  --shadow-head:0 6px 18px rgba(0,0,0,.4);
  --edge:inset 0 1px 0 rgba(255,255,255,.05);
  --scrim:rgba(6,7,12,.6);
  --shadow-card:none;
  --shadow-pop:0 12px 30px rgba(0,0,0,.5);
  --glow:rgba(127,209,255,.28);
  --danger:#FF9BB3; --danger-bg:rgba(255,120,140,.10); --danger-line:rgba(255,120,140,.30);
  --paper-a:#F6F2E6; --paper-b:#E2DAC6; --paper-text:#25242E; --paper-sub:#8A7F63; --paper-margin:rgba(200,80,80,.32);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* The document itself never scrolls. On iOS a position:fixed bar detaches from
   the bottom edge during rubber-band overscroll and when the keyboard opens, so
   the nav is a flex child of a fixed shell instead — it has no way to move. */
/* The page scrolls naturally. There is no fixed-height shell, so there is no
   shell height for iOS to under-report and no gap it can leave at the bottom —
   the canvas is painted by <body> and always fills the screen whatever the
   viewport reports. Nothing is anchored to the bottom edge any more, which is
   what made a fixed shell necessary in the first place. */
html,body{margin:0;min-height:100%}
body{overscroll-behavior-y:none}
body{
  font-family:var(--f);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  text-rendering:optimizeLegibility;
}
/* ambient ink wash — the only ornament on the page */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  transform:translateZ(0);   /* own layer: a fixed gradient repainting per scroll frame is visible jank on iOS */
  background:
    radial-gradient(120% 60% at 12% -8%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%),
    radial-gradient(100% 55% at 92% 4%, color-mix(in srgb,var(--accent-2) 11%,transparent), transparent 62%),
    radial-gradient(140% 70% at 50% 108%, color-mix(in srgb,var(--c2) 8%,transparent), transparent 65%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button,.topbar,.chips,.nav,.lens,.dow,.wgrid .wh{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* Written content stays selectable — you may want to copy your own words out. */
.page-body,.page-title,.det .block p,.ev .d{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- app frame ---------- */
/* No fixed height anywhere. iOS under-reports the viewport in a freshly
   launched standalone app, so any shell sized from that figure came out short
   and left dead space at the bottom. Letting the document scroll normally
   removes the question entirely: <body> paints the canvas, which always fills
   the screen, and the page is exactly as tall as its content. */
#app{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}

.topbar{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--sat) + 10px) 14px 0;
  background:var(--bg);
  box-shadow:0 1px 0 var(--line);
  transition:box-shadow .25s;
}
/* A real shadow appears only once content has moved under it. */
#app.scrolled .topbar{box-shadow:0 1px 0 var(--line), var(--shadow-head)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{
  margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px;
  background:linear-gradient(96deg,var(--text),var(--accent) 55%,var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .sub{font-size:10px;color:var(--text-3);letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* segmented lens switcher */
.lens{
  display:flex;gap:2px;margin-top:10px;padding:3px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
}
.lens button{
  flex:1;padding:6px 3px;border-radius:11px;font-size:10.5px;font-weight:700;white-space:nowrap;
  color:var(--text-2);transition:color .2s, background .25s, transform .25s;
}
.lens button[aria-selected="true"]{
  color:var(--on-accent);background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 2px 8px var(--glow);
}
.lens button:active{transform:scale(.96)}

/* category chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:9px 14px 8px;background:var(--bg);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  transition:transform .18s,border-color .2s,color .2s;
}
.chip:active{transform:scale(.93)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip b{font-weight:700;opacity:.6}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--line-2);background:var(--surface-2)}

/* The one and only scroll container in the app. */
main{
  flex:1 1 auto;
  padding:10px 14px calc(84px + var(--sab));
}

/* ---------- shared bits ---------- */
.sec-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-3);margin:22px 0 10px;
}
.empty{
  margin-top:56px;text-align:center;padding:0 24px;
}
.empty .mark{font-size:34px;opacity:.9}
.empty h3{margin:12px 0 5px;font-size:16px;font-weight:700}
.empty p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.6}
.empty button{
  margin-top:16px;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:var(--on-accent);background:linear-gradient(140deg,var(--accent),var(--accent-2));
}

/* event card — the unit of the whole app */
.ev{
  width:100%;text-align:left;display:block;position:relative;box-shadow:var(--shadow-card),var(--edge);
  contain:content;
  padding:10px 12px 10px 14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);
  overflow:hidden;transition:transform .16s,border-color .2s;
}
.ev{transition:transform .14s cubic-bezier(.32,.72,0,1),border-color .2s}
.ev:active{transform:scale(.975);border-color:var(--line-2)}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.ev .row{display:flex;align-items:center;gap:6px}
.ev .t{font-size:13.5px;font-weight:700;letter-spacing:-.15px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .star{font-size:10px;flex:0 0 auto}
.ev .meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:10.5px;color:var(--text-3)}
.ev .tag{color:var(--c);font-weight:700}
.ev .d{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:7px}

/* ---------- calendar lens ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.cal-head .m{flex:1;font-size:16px;font-weight:700;letter-spacing:-.3px}
.cal-head .m span{color:var(--text-3);font-weight:400}
.nav-btn{
  width:30px;height:30px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--text-2);
}
.nav-btn:active{transform:scale(.9)}
.today-btn{padding:6px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;color:var(--text-2)}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow span{text-align:center;font-size:9px;font-weight:700;color:var(--text-3);letter-spacing:.8px;
  padding-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{
  position:relative;min-height:50px;padding:4px 3px 3px;border-radius:10px;
  background:transparent;border:1px solid transparent;text-align:left;
  display:flex;flex-direction:column;gap:2px;overflow:hidden;
  transition:border-color .18s,background .18s;
}
/* Only days that hold something get a surface — an empty grid should read as
   empty, not as forty-two identical cards. */
.cell.has{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-card)}
.cell.out{opacity:.4}
.cell.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cell .n{font-size:10.5px;font-weight:700;color:var(--text-2);padding-left:2px}
.cell.today .n{
  color:var(--on-accent);background:var(--accent);border-radius:5px;
  width:15px;height:15px;display:grid;place-items:center;padding:0;font-size:9px;
}
.pill{
  font-size:8.5px;line-height:1.3;font-weight:700;padding:1.5px 3px;border-radius:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);
}
.more{font-size:8px;color:var(--text-3);padding-left:3px;font-weight:700}

.day-group{margin-top:16px;scroll-margin-top:calc(var(--head-h, 200px) + 10px)}
.day-group h4{
  margin:0 0 7px;font-size:11px;font-weight:700;color:var(--text-2);
  display:flex;align-items:center;gap:7px;
}
.day-group h4::after{content:"";flex:1;height:1px;background:var(--line)}
.day-group.flash > h4{color:var(--accent)}

/* ---------- journey tree lens ---------- */
.yr{margin-top:22px;content-visibility:auto;contain-intrinsic-size:auto 320px}
.yr-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.yr-head .y{font-size:26px;font-weight:700;letter-spacing:-1px;
  background:linear-gradient(120deg,var(--text),var(--text-3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.yr-head .c{font-size:10px;color:var(--text-3);font-weight:700}
.yr-head .caret{margin-left:auto;font-size:11px;color:var(--text-3);transition:transform .25s}
.yr[data-open="false"] .caret{transform:rotate(-90deg)}
.yr[data-open="false"] .yr-body{display:none}

.mo{position:relative;padding-left:20px;margin-top:12px}
.mo::before{content:"";position:absolute;left:5px;top:6px;bottom:2px;width:1.5px;
  background:linear-gradient(to bottom,var(--line-2),transparent)}
.mo-label{position:relative;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:8px}
.mo-label::before{
  content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-2);
}
.leaf{position:relative}
.leaf::before{
  content:"";position:absolute;left:-15px;top:20px;width:11px;height:1.5px;background:var(--line);
}

/* ---------- milestone map lens ---------- */
.map-toggle{display:flex;gap:6px;margin:14px 0 4px}
.map-toggle button{
  padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
}
.map-toggle button[aria-pressed="true"]{color:var(--text);border-color:var(--line-2);background:var(--surface-2)}

.trail{position:relative;padding-top:6px}
.checkpoint{
  display:flex;align-items:center;gap:9px;margin:14px 0 4px;
}
.checkpoint .badge{
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;
  background:var(--surface-2);border:1px dashed var(--line-2);color:var(--text);
}
.checkpoint .rule{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-2) 0 3px,transparent 3px 7px)}

.link{display:block;height:34px;width:24px}
.link path{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:2 4.5;stroke-linecap:round}

.stop{position:relative;padding-left:30px}
.stop .pin{
  position:absolute;left:2px;top:14px;width:17px;height:17px;border-radius:50%;
  background:var(--surface);border:2px solid var(--c);display:grid;place-items:center;
}
.stop .pin i{width:5px;height:5px;border-radius:50%;background:var(--c);display:block}
.stop .pin.big{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 16%,transparent)}

/* ---------- bottom nav ---------- */
/* Section navigation sits in the header, between the lens bar and the filters.
   Nothing anchored to the bottom edge means nothing that iOS can float. */
.nav{
  flex:0 0 auto;position:relative;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
  margin-top:8px;
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center;
  padding:7px 2px 6px;border-radius:12px;
  font-size:8.5px;font-weight:700;color:var(--text-3);letter-spacing:-.1px;
  transition:color .2s,background .2s;}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{
  color:var(--accent);
  background:color-mix(in srgb,var(--accent) 11%,transparent);
}
.nav button:active{transform:scale(.94)}
.srow:active{transform:scale(.99)}
.cell:active{transform:scale(.94)}
.cell{transition:border-color .18s,background .18s,transform .14s}
.nav button{position:relative}

/* floating record button — only on Timeline */
.fab-add{
  position:absolute;right:15px;bottom:calc(16px + var(--sab));z-index:41;
  width:54px;height:54px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--on-accent);
  box-shadow:0 10px 26px var(--glow);
  transition:transform .2s,opacity .2s;
}
.fab-add svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.fab-add:active{transform:scale(.9) rotate(90deg)}
.fab-add[hidden]{display:none}

/* work-in-progress screens */
.wip{margin-top:26px;text-align:center;padding:0 6px}
.wip .glyph{width:56px;height:56px;margin:0 auto;border-radius:20px;display:grid;place-items:center;
  font-size:24px;background:var(--surface);border:1px solid var(--line-2);color:var(--accent)}
.wip h3{margin:14px 0 3px;font-size:18px;font-weight:700;letter-spacing:-.3px}
.wip .tagline{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.6}
.wip .flag{display:inline-block;margin-top:12px;padding:5px 13px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 13%,transparent);border:1px dashed color-mix(in srgb,var(--accent-2) 38%,transparent)}
.wip ul{list-style:none;margin:22px 0 0;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px}
.wip li{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--text-2);line-height:1.5}
.wip li b{color:var(--text-3);font-size:10px;flex:0 0 auto;padding-top:1px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{will-change:transform}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  box-shadow:var(--shadow-pop);max-height:calc(92dvh - var(--kb, 0px));overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:var(--surface);border-top:1px solid var(--line-2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 18px calc(24px + var(--sab) + var(--kb, 0px));
  transform:translateY(101%);transition:transform .34s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.sheet h2{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.sheet .hint{margin:0 0 16px;font-size:11px;color:var(--text-3)}

.field{margin-bottom:13px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field textarea{
  width:100%;padding:11px 12px;border-radius:var(--r-md);
  background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-size:16px; /* 16px stops iOS zoom-on-focus */
  transition:border-color .2s;
}
.field textarea{resize:none;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3);opacity:.75}

.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick button{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--text-2);
}
.cat-pick button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cat-pick button[aria-pressed="true"]{color:var(--text);border-color:var(--c);
  background:color-mix(in srgb,var(--c) 13%,transparent)}
.cat-pick .new{border-style:dashed}

.newcat{display:none;gap:7px;margin-top:9px;align-items:center}
.newcat.on{display:flex}
.newcat input{flex:1;padding:9px 11px;border-radius:12px;background:var(--bg);
  border:1px solid var(--line);font-size:16px}
.swatches{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--text)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 13px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}
.toggle-row .tt{font-size:12.5px;font-weight:700}
.toggle-row .ts{font-size:10.5px;color:var(--text-3);margin-top:1px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--surface-2);position:relative;
  flex:0 0 auto;transition:background .25s;border:1px solid var(--line)}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--text-2);transition:transform .25s,background .25s}
.switch[aria-pressed="true"]{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent}
.switch[aria-pressed="true"] i{transform:translateX(18px);background:var(--on-accent)}

.btn-row{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:var(--r-md);font-size:13.5px;font-weight:700;text-align:center}
.btn-primary{color:var(--on-accent);background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--text-2)}
.btn-danger{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger)}
.btn:active{transform:scale(.98)}

/* detail sheet */
.det-cat{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.det-date{font-size:11.5px;color:var(--text-3);margin-top:9px}
.det h2{margin:8px 0 0;font-size:20px;line-height:1.3}
.det .block{margin-top:16px}
.det .block h5{margin:0 0 5px;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3)}
.det .block p{margin:0;font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;opacity:.9}

/* settings rows */
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;box-shadow:var(--shadow-card),var(--edge);
  transition:transform .14s cubic-bezier(.32,.72,0,1);
  padding:13px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);margin-bottom:7px}
.srow .ic{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.srow .tt{font-size:12.5px;font-weight:700}
.srow .ts{font-size:10.5px;color:var(--text-3);margin-top:1px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.stat{padding:13px 10px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-card),var(--edge);text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.5px}
.stat span{font-size:9.5px;color:var(--text-3);font-weight:700;letter-spacing:.6px;text-transform:uppercase}

.toast{
  position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,14px);
  z-index:90;padding:9px 16px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- search ---------- */
.icon-btn{
  width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-2);margin-left:auto;flex:0 0 auto;
  transition:background .2s,color .2s;
}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.icon-btn[aria-pressed="true"]{color:var(--bg);border-color:transparent;
  background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.search-row{display:none;margin-top:10px;position:relative}
.search-row.on{display:block}
.search-row input{
  width:100%;padding:9px 34px 9px 12px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);color:var(--text);font-size:16px;
}
.search-row input:focus{outline:none;border-color:var(--accent)}
.search-row input::placeholder{color:var(--text-3);opacity:.75}
.search-row .x{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:8px;color:var(--text-3);display:grid;place-items:center;font-size:14px}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text);border-radius:3px;padding:0 1px}

/* ---------- on this day ---------- */
.otd{
  padding:12px 13px;border-radius:var(--r-lg);margin:14px 0 2px;border:1px solid var(--line-2);
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 11%,transparent),color-mix(in srgb,var(--accent-2) 7%,transparent));
}
.otd h4{margin:0;font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent)}
.otd .sub{font-size:10.5px;color:var(--text-2);margin:3px 0 10px}

/* ---------- insights ---------- */
.bars{display:flex;align-items:flex-end;gap:4px;height:76px;padding:10px 11px 8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .b i{width:100%;border-radius:3px 3px 1px 1px;min-height:2px;display:block;opacity:.8;
  background:linear-gradient(to top,var(--accent),var(--accent-2))}
.bars .b span{font-size:7.5px;color:var(--text-3);font-weight:700;letter-spacing:.2px}
.bars .b.now i{opacity:1;box-shadow:0 0 12px var(--glow)}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-2);font-weight:700}
.legend b{width:7px;height:7px;border-radius:50%;display:block}
.note{font-size:10.5px;color:var(--text-3);margin:8px 0 0;line-height:1.5}

/* ---------- Timeline: the year, month by month ---------- */
.yr-nav{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.yr-nav .yv{flex:1;text-align:center;font-size:19px;font-weight:700;letter-spacing:-.5px}
.yr-nav .yv span{display:block;font-size:10px;color:var(--text-3);font-weight:400;
  letter-spacing:.3px;margin-top:1px}

/* Twelve identically sized tiles. Content never changes their height, so the
   grid cannot skew as events are added — the flaw in the earlier ribbon. */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.mtile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:52px;border-radius:12px;background:transparent;
  border:1px solid var(--line);color:var(--text-3);
  transition:transform .16s,background .2s,border-color .2s,color .2s;
}
.mtile:active{transform:scale(.95)}
.mtile .mname{font-size:11.5px;font-weight:700;letter-spacing:-.2px}
.mtile .mcount{font-size:9px;font-weight:700;opacity:.75}
.mtile.has{
  color:var(--text);border-color:transparent;
  background:color-mix(in srgb,var(--c) 15%,transparent);
  box-shadow:var(--shadow-card);
}
.mtile.has .mcount{color:var(--c);opacity:1}
.mtile.now{border-color:var(--accent)}

/* The header is sticky, so anything scrolled to must clear it or it lands
   underneath. --head-h is measured after every render. */
.mblock{margin-top:20px;scroll-margin-top:calc(var(--head-h, 200px) + 10px)}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.mhead .mbar{width:3px;height:15px;border-radius:2px;background:var(--c);flex:0 0 auto}
.mhead h4{margin:0;font-size:14px;font-weight:700;letter-spacing:-.3px;flex:1}
.mhead .mnum{font-size:10px;font-weight:700;color:var(--text-3);
  padding:2px 8px;border-radius:999px;background:var(--surface-2)}

/* ---------- Journals: the paper page ---------- */
.book{margin-top:14px;perspective:1400px}
.page{
  position:relative;border-radius:6px 14px 14px 6px;padding:18px 17px 34px 26px;
  min-height:340px;transform-origin:left center;
  color:var(--paper-text);
  background:
    linear-gradient(90deg, rgba(0,0,0,.13) 0 6px, rgba(0,0,0,.03) 6px 13px, transparent 13px),
    repeating-linear-gradient(var(--paper-a) 0 26px, var(--paper-b) 26px 27px);
  box-shadow:var(--shadow-pop), inset -12px 0 22px -18px rgba(0,0,0,.4);
}
.page::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;background:var(--paper-margin)}
.page-date{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--paper-sub)}
.page-title{margin:4px 0 0;font-size:19px;font-weight:700;line-height:26px;color:var(--paper-text);letter-spacing:-.3px}
.page-body{margin:8px 0 0;font-size:14px;line-height:26px;white-space:pre-wrap;color:var(--paper-text);opacity:.85;word-break:break-word}
.page-foot{position:absolute;left:26px;right:17px;bottom:12px;display:flex;justify-content:space-between;
  font-size:9.5px;color:var(--paper-sub);font-weight:700}
.page-foot button{color:var(--paper-sub);font-size:9.5px;font-weight:700}
.page.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--paper-sub)}
.page.blank .pen{font-size:26px;opacity:.5}
.page.blank p{font-size:12.5px;margin:8px 0 0;max-width:220px;line-height:1.6}

@keyframes turnNext{from{transform:rotateY(-26deg);opacity:.35}to{transform:none;opacity:1}}
@keyframes turnPrev{from{transform:rotateY(26deg);opacity:.35}to{transform:none;opacity:1}}
.page.next{animation:turnNext .38s cubic-bezier(.3,.8,.3,1)}
.page.prev{animation:turnPrev .38s cubic-bezier(.3,.8,.3,1)}

.flipbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.flipbar button{
  flex:1;padding:11px;border-radius:var(--r-md);font-size:12px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
}
.flipbar button:disabled{opacity:.35}
.flipbar button:active:not(:disabled){transform:scale(.97)}
.flipbar .pos{flex:0 0 auto;font-size:10.5px;color:var(--text-3);font-weight:700;min-width:52px;text-align:center}

/* ---------- Journals: milestone boxes ---------- */
.stones{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}
.stone{
  text-align:left;padding:10px;border-radius:var(--r-md);min-width:0;contain:content;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card),var(--edge);
  transition:transform .16s,border-color .2s;
}
.stone:active{transform:scale(.97);border-color:var(--line-2)}
.stone .dt{font-size:8.5px;font-weight:700;letter-spacing:.5px;color:var(--c);text-transform:uppercase}
.stone .ti{font-size:12px;font-weight:700;margin-top:3px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stone .sn{font-size:10px;color:var(--text-3);margin-top:3px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Habits: the ring ---------- */
.ringwrap{display:flex;flex-direction:column;align-items:center;margin:16px 0 4px}
.ring{width:186px;height:186px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--surface-2)}
.ringcap{margin-top:-116px;margin-bottom:78px;text-align:center;pointer-events:none}
.ringcap b{display:block;font-size:38px;font-weight:700;letter-spacing:-2px;line-height:1}
.ringcap b span{font-size:17px;color:var(--text-3);letter-spacing:-.5px}
.ringcap em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text-3);display:block;margin-top:5px}
.ringnote{text-align:center;font-size:12px;color:var(--text-2);margin:2px 0 0;line-height:1.5}

/* ---------- Habits: a row you can tick ---------- */
.hrow{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card),var(--edge);
  transition:border-color .2s,background .2s}
.hrow.done{border-color:color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.tick{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:2px solid color-mix(in srgb,var(--c) 55%,transparent);color:transparent;
  font-size:15px;font-weight:700;transition:transform .18s,background .2s,color .2s}
.tick:active{transform:scale(.85)}
.hrow.done .tick{background:var(--c);border-color:var(--c);color:#FFFFFF}
.hmeta{flex:1;min-width:0;text-align:left}
.hmeta .hn{font-size:13.5px;font-weight:700;letter-spacing:-.15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta .hs{font-size:10.5px;color:var(--text-3);margin-top:2px;

.hmeta .hs b{color:var(--c);font-weight:700}
.hgo{flex:0 0 auto;color:var(--text-3);font-size:14px;padding:4px 2px}

/* ---------- Habits: weekly grid ---------- */
.wk-head{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.wk-head .wv{flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.2px}

.wgrid .wh i{display:block;font-style:normal;font-size:9.5px;color:var(--text-2)}

.wgrid .wname{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;padding:7px 6px 7px 0;min-width:0;text-align:left}

  transition:transform .16s,background .2s}

.wcell.on{background:var(--c);border-color:var(--c)}
.wcell.off{opacity:.3;border-style:dashed;background:transparent}
.wcell.future{opacity:.2}

.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.ws{text-align:center;padding:12px 4px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card),var(--edge)}

/* ---------- Habits: completion calendar ---------- */
.hcal .cell{min-height:46px;align-items:center;justify-content:flex-start;gap:4px;padding-top:5px}
.dial{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0)}
.dial i{width:12px;height:12px;border-radius:50%;background:var(--surface);display:block;
  font-size:7px;font-style:normal;color:var(--text-2);display:grid;place-items:center;font-weight:700}
.dial.full{background:linear-gradient(140deg,var(--accent),var(--accent-2))}
.dial.none{background:var(--surface-2)}

/* ---------- Habits: day picker in the editor ---------- */
.dow-pick{display:flex;gap:5px}

  background:var(--bg);border:1px solid var(--line);color:var(--text-3)}
.dow-pick button[aria-pressed="true"]{color:var(--text);border-color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,transparent)}

/* ---------- theme picker ---------- */

  border:1px solid var(--line);text-align:left;box-shadow:var(--shadow-card);transition:transform .16s}

.theme .tn{font-size:12px;font-weight:700}

/* entrance motion */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim > *{animation:rise .3s cubic-bezier(.22,.9,.3,1) backwards}
.anim > *:nth-child(1){animation-delay:0s}

<script>
/* ============================================================
   Clickjacking guard. `frame-ancestors` is ignored in a meta CSP,
   so if another origin embeds this page we cover it with a visible
   notice — an invisible overlay is the whole point of a clickjack.
   ============================================================ */
(function(){
  let framedByOther = false;
  try { framedByOther = window.top !== window.self && !window.top.location.origin; }
  catch(e){ framedByOther = true; }              // cross-origin access throws
  if(!framedByOther) return;
  document.addEventListener('DOMContentLoaded', () => {
    const s = document.createElement('div');
    s.setAttribute('style','position:fixed;inset:0;z-index:9999;background:#0C0E16;color:#EDF0F8;'
      + 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;'
      + 'padding:28px;text-align:center;font:400 14px/1.6 system-ui,sans-serif;'
      + 'overflow:auto;-webkit-overflow-scrolling:touch');
    const h = document.createElement('div');
    h.setAttribute('style','font-size:16px;font-weight:700');
    h.textContent = 'Chrono Studio is embedded in another site';
    const p = document.createElement('div');
    p.setAttribute('style','color:#858CA6;max-width:340px;font-size:12.5px');
    p.textContent = 'Your journal is not shown inside another page. Open Chrono at its own address instead.';
    const b = document.createElement('button');
    b.setAttribute('style','padding:10px 18px;border-radius:999px;border:1px solid #333a52;'
      + 'background:#151A29;color:#858CA6;font:inherit;font-size:12px');
    b.textContent = 'I embedded this myself — continue';
    b.addEventListener('click', () => s.remove());
    s.append(h, p, b);
    document.body.appendChild(s);
  });
})();
</script>

<script>
/* ============================================================
   Storage — device-only, with an in-memory fallback so the app
   still runs in sandboxed previews where localStorage is blocked.

   This origin is shared with every other project published under
   the same account, so localStorage is a shared box. Chrono is
   confined to its own corner of it by construction:

     - Every key must begin with NS. Anything else is refused, so
       a typo or a future bug cannot read or overwrite another
       project's data.
     - The store is never enumerated. No localStorage.length, no
       .key(i), no Object.keys(localStorage) — Chrono has no way
       to discover that another project's keys even exist.
     - localStorage.clear() is never called. It would wipe the
       whole origin, including everything that isn't ours.
   ============================================================ */
const NS = 'chrono.';
const owned = k => typeof k === 'string' && k.startsWith(NS);

const Store = (() => {
  let live = true, mem = {};
  try { localStorage.setItem(NS + '__probe', '1'); localStorage.removeItem(NS + '__probe'); }
  catch(e){ live = false; }
  return {
    live,
    get(k){
      if(!owned(k)) return null;
      try{ return live ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; }
    },
    set(k,v){
      if(!owned(k)) return false;
      try{
        if(live){ localStorage.setItem(k,v); } else { mem[k]=v; }
        return true;
      }catch(e){ mem[k]=v; return false; } // quota exceeded / storage disabled mid-session
    },
    del(k){
      if(!owned(k)) return;
      try{ live ? localStorage.removeItem(k) : delete mem[k]; }catch(e){ delete mem[k]; }
    }
  };
})();

const K_EV = 'chrono.events.v1', K_CAT = 'chrono.categories.v1';

const DEFAULT_CATS = [
  { id:'life',   name:'Life',   color:'#3B82C4' },
  { id:'health', name:'Health', color:'#2FA36E' },
  { id:'career', name:'Career', color:'#D9862B' },
  { id:'love',   name:'Love',   color:'#D1567F' }
];
/* Mid-tone by design: these have to stay legible as text on a light ground
   and still read as colour on a dark one, so nothing here is a pastel or a neon. */
const SWATCHES = ['#3B82C4','#2FA36E','#D9862B','#D1567F','#7C5CD6','#159C9C','#D1552F','#7E9E2C'];

const S = {
  events: [],
  cats: [],
  journals: { diary: [], manifest: [] },
  habits: [],
  hlog: {},
  hWeek: new Date(),
  hCursor: new Date(),
  hSel: null,
  hDraft: null,
  theme: 'studio',
  lens: { timeline:'calendar', diary:'calendar', manifest:'calendar', habit:'today' },
  jCursor: { diary: new Date(), manifest: new Date() },
  jPage: { diary: 0, manifest: 0 },
  flipDir: 1,
  tab: 'timeline',
  cat: 'all',
  cursor: new Date(),
  selDay: null,
  mapMode: 'milestones',
  openYears: {},
  query: '',
  searchOpen: false,
  draft: null,
  jDraft: null
};

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW  = ['S','M','T','W','T','F','S'];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
// Built at midday, not midnight: in zones where DST shifts at 00:00 a
// midnight date can roll to the previous day and misplace an event.
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d, 12); };
const todayISO = () => iso(new Date());
const catOf = id => S.cats.find(c => c.id === id) || { id:'?', name:'Uncategorised', color:'#858CA6' };
const longDate = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const dayLabel = s => { const d = parse(s); return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]} ${d.getDate()}`; };

/* ============================================================
   Validation — every record is normalised before it is trusted,
   whether it came from an imported file or from localStorage
   (a tampered store is treated exactly like a hostile file).
   ============================================================ */
const RX_ID    = /^[A-Za-z0-9_-]{1,48}$/;
const RX_DATE  = /^\d{4}-\d{2}-\d{2}$/;
const RX_COLOR = /^#[0-9A-Fa-f]{6}$/;
const CAP = { title:120, about:80, desc:8000, name:24 };
const MAX_EVENTS = 20000;
const MAX_CATS = 24;
const MAX_IMPORT_BYTES = 8 * 1024 * 1024;

/* Only ever emit a colour we have proven is a plain hex literal.
   Without this, an imported category colour reaches a style attribute. */
const col = c => RX_COLOR.test(c) ? c : '#858CA6';

function validDate(s){
  if(typeof s !== 'string' || !RX_DATE.test(s)) return false;
  const d = parse(s);
  return !isNaN(d.getTime()) && iso(d) === s;   // also rejects 2026-02-31
}

/* Strip control characters, cap length. Nothing here trusts the input's type. */
function cleanText(v, max){
  return String(v == null ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u202A-\u202E\u2066-\u2069]/g, '')
    .slice(0, max).trim();
}

function cleanCat(c){
  if(!c || typeof c !== 'object' || Array.isArray(c)) return null;
  const name = cleanText(c.name, CAP.name);
  if(!RX_ID.test(c.id) || !name) return null;
  return { id: c.id, name, color: RX_COLOR.test(c.color) ? c.color : SWATCHES[4] };
}

function cleanEvent(e, allowedIds, fallbackCat){
  if(!e || typeof e !== 'object' || Array.isArray(e)) return null;
  const title = cleanText(e.title, CAP.title);
  if(!validDate(e.date) || !title) return null;
  const created = Number.isFinite(+e.created) ? +e.created : Date.now();
  return {
    id: RX_ID.test(e.id) ? e.id : uid(),
    date: e.date,
    title,
    about: cleanText(e.about, CAP.about),
    description: cleanText(e.description, CAP.desc),
    catId: allowedIds.has(e.catId) ? e.catId : fallbackCat,
    milestone: e.milestone === true,
    created,
    updated: Date.now()
  };
}

function normaliseAll(rawCats, rawEvents){
  let cats = (Array.isArray(rawCats) ? rawCats : []).map(cleanCat).filter(Boolean);
  // guarantee the four built-ins always exist and are never shadowed
  DEFAULT_CATS.forEach(d => { if(!cats.some(c => c.id === d.id)) cats.push({ ...d }); });
  const seen = new Set();
  cats = cats.filter(c => seen.has(c.id) ? false : seen.add(c.id));
  const events = (Array.isArray(rawEvents) ? rawEvents : [])
    .slice(0, MAX_EVENTS)
    .map(e => cleanEvent(e, seen, cats[0].id))
    .filter(Boolean);
  return { cats, events };
}

function load(){
  let rawE = [], rawC = null;
  try { rawE = JSON.parse(Store.get(K_EV) || '[]'); } catch(e){ rawE = []; }
  try { rawC = JSON.parse(Store.get(K_CAT) || 'null'); } catch(e){ rawC = null; }
  const out = normaliseAll(rawC, rawE);
  S.cats = out.cats;
  S.events = out.events;
  loadJournals();
  loadHabits();
  applyTheme(Store.get(K_THEME));
}

function saveEvents(){
  if(!Store.set(K_EV, JSON.stringify(S.events)))
    toast('Could not save — storage is full. Export a backup.');
}
function saveCats(){
  if(!Store.set(K_CAT, JSON.stringify(S.cats)))
    toast('Could not save — storage is full. Export a backup.');
}

const filtered = () => S.events
  .filter(e => S.cat === 'all' || e.catId === S.cat)
  .sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2100);
}
function haptic(){ if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){} }

/* ============================================================
   Event card
   ============================================================ */
/* Highlight by scanning the RAW string and escaping each piece separately.
   Matching against already-escaped text would let a query like "amp" or "39"
   split an HTML entity apart. No regex here, so no ReDoS surface either. */
function hl(text, q){
  const s = String(text == null ? '' : text);
  const needle = String(q == null ? '' : q).toLowerCase();
  if(!needle) return esc(s);
  const hay = s.toLowerCase();
  let out = '', i = 0;
  for(;;){
    const j = hay.indexOf(needle, i);
    if(j < 0){ out += esc(s.slice(i)); break; }
    out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + needle.length)) + '</mark>';
    i = j + needle.length;
  }
  return out;
}

function evCard(e, q){
  const c = catOf(e.catId);
  return `<button class="ev" style="--c:${col(c.color)}" data-ev="${esc(e.id)}">
    <div class="row">
      <span class="t">${hl(e.title, q)}</span>
      ${e.milestone ? '<span class="star">★</span>' : ''}
    </div>
    <div class="meta"><span class="tag">${esc(c.name)}</span><span>·</span><span>${longDate(e.date)}</span>
      ${e.about ? `<span>·</span><span>${hl(e.about, q)}</span>` : ''}</div>
    ${e.description ? `<div class="d">${hl(e.description, q)}</div>` : ''}
  </button>`;
}

/* ============================================================
   Search — spans every lens, respects the category filter
   ============================================================ */
function matchEv(e, q){
  return (e.title + ' ' + e.description + ' ' + e.about + ' ' + catOf(e.catId).name)
    .toLowerCase().includes(q);
}

function renderSearch(){
  const q = S.query.trim().toLowerCase();
  const hits = S.events
    .filter(e => (S.cat === 'all' || e.catId === S.cat) && matchEv(e, q))
    .sort((a,b) => b.date.localeCompare(a.date));

  if(!hits.length) return `<div class="empty"><div class="mark">◌</div>
    <h3>Nothing matches “${esc(S.query)}”</h3>
    <p>Try a shorter word${S.cat !== 'all' ? ', or switch the category filter back to All' : ''}.</p></div>`;

  const years = {};
  hits.forEach(e => (years[e.date.slice(0,4)] = years[e.date.slice(0,4)] || []).push(e));

  return `<div class="sec-label">${hits.length} match${hits.length===1?'':'es'} for “${esc(S.query)}”</div>` +
    Object.keys(years).sort((a,b) => b - a).map(y =>
      `<div class="day-group"><h4>${esc(y)}</h4>
        <div class="stack">${years[y].map(e => evCard(e, S.query.trim())).join('')}</div></div>`
    ).join('');
}

/* ============================================================
   On this day — same calendar day, earlier years
   ============================================================ */
function onThisDay(){
  const now = new Date();
  const md = `-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return S.events
    .filter(e => (S.cat === 'all' || e.catId === S.cat))
    .filter(e => e.date.endsWith(md) && +e.date.slice(0,4) < now.getFullYear())
    .sort((a,b) => b.date.localeCompare(a.date));
}

function otdBlock(){
  const hits = onThisDay();
  if(!hits.length) return '';
  const now = new Date().getFullYear();
  const gaps = hits.map(e => now - +e.date.slice(0,4));
  const span = gaps.length === 1
    ? `${gaps[0]} year${gaps[0]===1?'':'s'} ago today`
    : `${gaps[gaps.length-1]}–${gaps[0]} years ago today`;
  return `<div class="otd"><h4>On this day</h4><div class="sub">${span}</div>
    <div class="stack">${hits.map(e => evCard(e)).join('')}</div></div>`;
}

/* ============================================================
   Lens 1 — Calendar
   ============================================================ */
function renderCalendar(){
  const list = filtered();
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  const byDate = {};
  list.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));

  const first = new Date(y, m, 1, 12);
  const start = new Date(y, m, 1 - first.getDay(), 12);
  const tISO = todayISO();

  let cells = '';
  for(let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12);
    const key = iso(d), out = d.getMonth() !== m;
    const evs = byDate[key] || [];
    const pills = evs.slice(0,2).map(e =>
      `<span class="pill" style="--c:${col(catOf(e.catId).color)}">${esc(e.title)}</span>`).join('');
    cells += `<button class="cell${evs.length?' has':''}${out?' out':''}${key===tISO?' today':''}${key===S.selDay?' sel':''}" data-day="${esc(key)}">
      <span class="n">${d.getDate()}</span>${pills}
      ${evs.length>2 ? `<span class="more">+${evs.length-2}</span>` : ''}
    </button>`;
  }

  const monthEvs = list.filter(e => e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`))
                       .sort((a,b) => a.date.localeCompare(b.date));
  const groups = {};
  monthEvs.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));

  let agenda = Object.keys(groups).length
    ? Object.keys(groups).sort().map(k => `<div class="day-group" id="d-${esc(k)}">
        <h4>${dayLabel(k)}</h4><div class="stack">${groups[k].map(evCard).join('')}</div></div>`).join('')
    : `<p style="margin-top:22px;font-size:12px;color:var(--text-3);text-align:center">
         Nothing recorded in ${MON[m]} yet.</p>`;

  // Selected an empty day? Offer to fill it, right there.
  if(S.selDay && !groups[S.selDay] && parse(S.selDay).getMonth() === m && parse(S.selDay).getFullYear() === y){
    agenda = `<button class="srow" data-add-on="${esc(S.selDay)}" style="margin-bottom:12px">
        <span class="ic">＋</span><div style="flex:1"><div class="tt">Add an event on ${longDate(S.selDay)}</div>
        <div class="ts">This day is still blank</div></div></button>` + agenda;
  }

  const now = new Date();
  const otd = (y === now.getFullYear() && m === now.getMonth()) ? otdBlock() : '';

  return otd + `<div class="cal-head">
      <button class="nav-btn" data-mv="-1" aria-label="Previous month">‹</button>
      <div class="m">${MON[m]} <span>${y}</span></div>
      <button class="today-btn" data-mv="0">Today</button>
      <button class="nav-btn" data-mv="1" aria-label="Next month">›</button>
    </div>
    <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="sec-label">${monthEvs.length} event${monthEvs.length===1?'':'s'} this month</div>
    ${agenda}`;
}

/* ============================================================
   Lens 2 — Journey tree
   ============================================================ */
function renderTree(){
  const list = filtered();
  if(!list.length) return emptyState('Your tree has no branches yet', 'Every event you save grows a new leaf, grouped by the year and month it happened.');

  const years = {};
  list.forEach(e => {
    const d = parse(e.date), yy = d.getFullYear(), mm = d.getMonth();
    years[yy] = years[yy] || {};
    (years[yy][mm] = years[yy][mm] || []).push(e);
  });

  return Object.keys(years).sort((a,b) => b - a).map(yy => {
    const months = years[yy];
    const count = Object.values(months).reduce((n,a) => n + a.length, 0);
    const open = S.openYears[yy] !== false;
    const body = Object.keys(months).sort((a,b) => b - a).map(mm => `
      <div class="mo">
        <div class="mo-label">${MON[mm]} · ${months[mm].length}</div>
        <div class="stack">${months[mm].map(e => `<div class="leaf">${evCard(e)}</div>`).join('')}</div>
      </div>`).join('');
    return `<section class="yr" data-open="${open}">
      <button class="yr-head" data-year="${esc(yy)}">
        <span class="y">${yy}</span><span class="c">${count} event${count===1?'':'s'}</span>
        <span class="caret">▾</span>
      </button>
      <div class="yr-body">${body}</div>
    </section>`;
  }).join('');
}

/* ============================================================
   Lens 3 — Milestone map  (the signature view)
   ============================================================ */
function renderMap(){
  const all = filtered();
  const stars = all.filter(e => e.milestone);
  const useStars = S.mapMode === 'milestones' && stars.length > 0;
  const list = (useStars ? stars : all).slice().sort((a,b) => a.date.localeCompare(b.date));

  const toggle = `<div class="map-toggle">
      <button data-map="milestones" aria-pressed="${S.mapMode==='milestones'}">★ Milestones${stars.length?` (${stars.length})`:''}</button>
      <button data-map="all" aria-pressed="${S.mapMode==='all'}">All events</button>
    </div>`;

  if(!list.length) return toggle + emptyState('No stops on the map yet',
    'Mark an event as a milestone while saving it and it becomes a stop on your trail.');

  const note = (S.mapMode === 'milestones' && !stars.length)
    ? `<p style="font-size:11px;color:var(--text-3);margin:8px 0 0">No milestones marked yet — showing everything instead.</p>` : '';

  let out = '', lastYear = null, n = 0;
  list.forEach((e, i) => {
    const yy = parse(e.date).getFullYear();
    if(yy !== lastYear){
      out += `<div class="checkpoint"><span class="badge">${yy}</span><span class="rule"></span></div>`;
      lastYear = yy;
    } else if(i > 0){
      const bow = n % 2 === 0 ? 21 : 0;
      out += `<svg class="link" viewBox="0 0 24 34" aria-hidden="true">
        <path d="M10.5,0 C10.5,13 ${bow},21 10.5,34"/></svg>`;
    }
    n++;
    const c = catOf(e.catId).color;
    out += `<div class="stop" style="--c:${col(c)}">
      <span class="pin${e.milestone?' big':''}"><i></i></span>${evCard(e)}
    </div>`;
  });

  return toggle + note + `<div class="trail">${out}</div>`;
}

function emptyState(h, p){
  return `<div class="empty"><div class="mark">✎</div><h3>${h}</h3><p>${p}</p>
    <button data-open-add="1">Record an event</button></div>`;
}

/* ============================================================
   Insights — streaks and rhythm, computed from months not days
   (a life journal shouldn't demand a daily entry)
   ============================================================ */
function monthIndex(k){ const [y,m] = k.split('-').map(Number); return y*12 + (m-1); }
function monthKey(i){ return `${Math.floor(i/12)}-${String(i%12 + 1).padStart(2,'0')}`; }

function insights(){
  if(!S.events.length) return '';

  const counts = {};
  S.events.forEach(e => { const k = e.date.slice(0,7); counts[k] = (counts[k]||0) + 1; });
  const keys = Object.keys(counts).sort();

  // longest consecutive run of months containing at least one event
  let longest = 1, run = 1, tail = 1;
  for(let i = 1; i < keys.length; i++){
    run = monthIndex(keys[i]) === monthIndex(keys[i-1]) + 1 ? run + 1 : 1;
    if(run > longest) longest = run;
  }
  tail = run;
  const nowIdx = monthIndex(todayISO().slice(0,7));
  const lastIdx = monthIndex(keys[keys.length-1]);
  const isLive = lastIdx === nowIdx;
  const streakLabel = isLive ? 'Current run' : 'Last run';

  // busiest single month
  const busiest = keys.reduce((a,b) => counts[b] > counts[a] ? b : a, keys[0]);
  const [by, bm] = busiest.split('-').map(Number);

  // last 12 months
  const bars = [];
  for(let i = nowIdx - 11; i <= nowIdx; i++){
    const k = monthKey(i);
    bars.push({ k, n: counts[k] || 0, m: i % 12, now: i === nowIdx });
  }
  const peak = Math.max(1, ...bars.map(b => b.n));

  // category split
  const total = S.events.length;
  const split = S.cats.map(c => ({ ...c, n: S.events.filter(e => e.catId === c.id).length }))
                      .filter(c => c.n > 0)
                      .sort((a,b) => b.n - a.n);

  return `<div class="sec-label">Your rhythm</div>
    <div class="stat-grid">
      <div class="stat"><b>${tail}</b><span>${streakLabel}</span></div>
      <div class="stat"><b>${longest}</b><span>Longest run</span></div>
      <div class="stat"><b>${counts[busiest]}</b><span>Busiest month</span></div>
    </div>
    <p class="note">${isLive
      ? `You've recorded something every month for ${tail} month${tail===1?'':'s'} straight.`
      : `Your last run reached ${tail} month${tail===1?'':'s'}, ending ${MON3[monthIndex(keys[keys.length-1])%12]} ${keys[keys.length-1].slice(0,4)}.`}
      ${MON[bm-1]} ${by} was your fullest, with ${counts[busiest]} event${counts[busiest]===1?'':'s'}.</p>

    <div class="sec-label">Last 12 months</div>
    <div class="bars">
      ${bars.map(b => `<div class="b${b.now?' now':''}" title="${b.n}">
        <i style="height:${Math.round(b.n / peak * 100)}%"></i><span>${MON3[b.m][0]}</span></div>`).join('')}
    </div>

    <div class="sec-label">What you record most</div>
    <div class="split">${split.map(c =>
      `<i style="width:${(c.n/total*100).toFixed(1)}%;background:${col(c.color)}"></i>`).join('')}</div>
    <div class="legend">${split.map(c =>
      `<span><b style="background:${col(c.color)}"></b>${esc(c.name)} ${Math.round(c.n/total*100)}%</span>`).join('')}</div>`;
}

/* ============================================================
   Lens 2 — Monthly ribbon. The year snakes left-to-right, then
   back again, with events on stems above and below the track.
   Three months per row, because twelve across is unreadable on
   a phone; the snake and the alternation carry the same idea.
   ============================================================ */
const MONTH_INK = ['#4E8FB5','#7B6BB8','#C98A31','#C25E45','#2E9B7F','#3E9CC4',
                   '#4E8FB5','#7B6BB8','#C98A31','#C25E45','#2E9B7F','#3E9CC4'];

function renderMonthly(){
  const list = filtered();
  const y = S.cursor.getFullYear();
  const inYear = list.filter(e => e.date.startsWith(String(y)))
                     .sort((a,b) => a.date.localeCompare(b.date));

  const byMonth = Array.from({ length:12 }, () => []);
  inYear.forEach(e => byMonth[parse(e.date).getMonth()].push(e));

  const now = new Date();
  const thisMonth = (now.getFullYear() === y) ? now.getMonth() : -1;

  // One year at a glance: twelve tiles of identical size. Nothing here changes
  // height with content, so adding events cannot skew the grid.
  const tiles = byMonth.map((evs, m) => `
    <button class="mtile${evs.length ? ' has' : ''}${m === thisMonth ? ' now' : ''}"
            style="--c:${col(MONTH_INK[m])}" data-mon="${esc(m)}">
      <span class="mname">${MON3[m]}</span>
      <span class="mcount">${evs.length || '—'}</span>
    </button>`).join('');

  // Then the year in full, month by month, in order.
  const months = byMonth.map((evs, m) => {
    if(!evs.length) return '';
    return `<section class="mblock" id="m-${y}-${m}">
      <div class="mhead" style="--c:${col(MONTH_INK[m])}">
        <span class="mbar"></span>
        <h4>${MON[m]}</h4>
        <span class="mnum">${evs.length}</span>
      </div>
      <div class="stack">${evs.map(e => evCard(e)).join('')}</div>
    </section>`;
  }).join('');

  const body = inYear.length ? months : `<div class="empty" style="margin-top:34px">
      <div class="mark">◷</div><h3>Nothing recorded in ${y}</h3>
      <p>Use the arrows to look at another year, or tap ✛ to add something.</p></div>`;

  return `<div class="yr-nav">
      <button class="nav-btn" data-yr="-1" aria-label="Previous year">‹</button>
      <div class="yv">${y}<span>${inYear.length} event${inYear.length===1?'':'s'}</span></div>
      <button class="nav-btn" data-yr="1" aria-label="Next year">›</button>
    </div>
    <div class="mgrid">${tiles}</div>
    ${body}`;
}

/* ============================================================
   Journals — Diary and Manifestation are the same machine with
   different data, so they share one implementation throughout.
   ============================================================ */
const JOURNALS = {
  diary: {
    key:'chrono.diary.v1', name:'Diary', one:'entry', many:'entries',
    accent:'#7C5CD6', verb:'Write',
    blank:'This diary is empty. Tap ✛ and write the first page.',
    prompt:'What kind of day was it?'
  },
  manifest: {
    key:'chrono.manifest.v1', name:'Manifestation', one:'intention', many:'intentions',
    accent:'#D9862B', verb:'Set',
    blank:'Nothing set down yet. Tap ✛ and name the first one.',
    prompt:'What are you working toward?'
  }
};
const isJournal = t => Object.prototype.hasOwnProperty.call(JOURNALS, t);

const LENSES = {
  timeline: [['calendar','Calendar'],['monthly','Monthly'],['tree','Journey tree'],['map','Milestone map']],
  diary:    [['calendar','Calendar'],['book','Diary view'],['stones','Milestones']],
  manifest: [['calendar','Calendar'],['book','Manifestations'],['stones','Milestones']],
  habit:    [['today','Today'],['week','Week'],['calendar','Calendar']]
};

/* Entries carry only what was asked for: a date, a title and a body. */
function cleanEntry(e){
  if(!e || typeof e !== 'object' || Array.isArray(e)) return null;
  const title = cleanText(e.title, CAP.title);
  if(!validDate(e.date) || !title) return null;
  return {
    id: RX_ID.test(e.id) ? e.id : uid(),
    date: e.date,
    title,
    description: cleanText(e.description, CAP.desc),
    created: Number.isFinite(+e.created) ? +e.created : Date.now(),
    updated: Date.now()
  };
}
const normaliseEntries = raw =>
  (Array.isArray(raw) ? raw : []).slice(0, MAX_EVENTS).map(cleanEntry).filter(Boolean);

function loadJournals(){
  Object.keys(JOURNALS).forEach(k => {
    let raw = [];
    try { raw = JSON.parse(Store.get(JOURNALS[k].key) || '[]'); } catch(e){ raw = []; }
    S.journals[k] = normaliseEntries(raw);
  });
}
function saveJournal(k){
  if(!Store.set(JOURNALS[k].key, JSON.stringify(S.journals[k])))
    toast('Could not save — storage is full. Export a backup.');
}
/* Newest last, so the book reads forward in time like a real one. */
const jSorted = k => S.journals[k].slice().sort((a,b) => a.date.localeCompare(b.date) || a.created - b.created);
const jEntry  = (k, id) => S.journals[k].find(e => e.id === id);

/* ============================================================
   Journal lens 1 — Calendar with snippets
   ============================================================ */
function renderJCalendar(k){
  const cfg = JOURNALS[k];
  const cur = S.jCursor[k];
  const y = cur.getFullYear(), m = cur.getMonth();
  const byDate = {};
  S.journals[k].forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));

  const first = new Date(y, m, 1, 12);
  const start = new Date(y, m, 1 - first.getDay(), 12);
  const tISO = todayISO();

  let cells = '';
  for(let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12);
    const key = iso(d), out = d.getMonth() !== m;
    const es = byDate[key] || [];
    const pills = es.slice(0,2).map(e =>
      `<span class="pill" style="--c:${col(cfg.accent)}">${esc(e.title)}</span>`).join('');
    cells += `<button class="cell${es.length?' has':''}${out?' out':''}${key===tISO?' today':''}" data-jday="${k}:${esc(key)}">
      <span class="n">${d.getDate()}</span>${pills}
      ${es.length>2 ? `<span class="more">+${es.length-2}</span>` : ''}
    </button>`;
  }

  const monthly = S.journals[k]
    .filter(e => e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`))
    .sort((a,b) => a.date.localeCompare(b.date));

  const list = monthly.length
    ? `<div class="stack">${monthly.map(e => jCard(k, e)).join('')}</div>`
    : `<p style="margin-top:20px;font-size:12px;color:var(--text-3);text-align:center">
         Nothing written in ${MON[m]}.</p>`;

  return `<div class="cal-head">
      <button class="nav-btn" data-jmv="${k}:-1" aria-label="Previous month">‹</button>
      <div class="m">${MON[m]} <span>${y}</span></div>
      <button class="today-btn" data-jmv="${k}:0">Today</button>
      <button class="nav-btn" data-jmv="${k}:1" aria-label="Next month">›</button>
    </div>
    <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="sec-label">${monthly.length} ${monthly.length===1?cfg.one:cfg.many} this month</div>
    ${list}`;
}

function jCard(k, e){
  const c = col(JOURNALS[k].accent);
  return `<button class="ev" style="--c:${c}" data-jopen="${k}:${esc(e.id)}">
    <div class="row"><span class="t">${esc(e.title)}</span></div>
    <div class="meta"><span>${longDate(e.date)}</span></div>
    ${e.description ? `<div class="d">${esc(e.description)}</div>` : ''}
  </button>`;
}

/* ============================================================
   Journal lens 2 — the book. One page, one entry, turn to read.
   ============================================================ */
function renderBook(k){
  const cfg = JOURNALS[k];
  const list = jSorted(k);

  if(!list.length){
    return `<div class="book"><div class="page blank">
      <div class="pen">✒</div><p>${esc(cfg.blank)}</p></div></div>`;
  }

  let i = S.jPage[k];
  if(!Number.isInteger(i) || i < 0 || i >= list.length){ i = list.length - 1; S.jPage[k] = i; }
  const e = list[i];
  const dir = S.flipDir === -1 ? 'prev' : 'next';

  return `<div class="book">
      <article class="page ${dir}">
        <div class="page-date">${dayLabel(e.date)} · ${MON[parse(e.date).getMonth()]} ${parse(e.date).getFullYear()}</div>
        <h3 class="page-title">${esc(e.title)}</h3>
        <div class="page-body">${esc(e.description) || '<em style="opacity:.5">No details written on this page.</em>'}</div>
        <div class="page-foot">
          <button data-jopen="${k}:${esc(e.id)}">Edit this page</button>
          <span>${i+1} of ${list.length}</span>
        </div>
      </article>
    </div>
    <div class="flipbar">
      <button data-jflip="${k}:-1" ${i===0?'disabled':''}>‹ Previous</button>
      <span class="pos">${i+1} / ${list.length}</span>
      <button data-jflip="${k}:1" ${i===list.length-1?'disabled':''}>Next ›</button>
    </div>`;
}

/* ============================================================
   Journal lens 3 — every title, date-wise, in small boxes
   ============================================================ */
function renderStones(k){
  const cfg = JOURNALS[k];
  const list = S.journals[k].slice().sort((a,b) => b.date.localeCompare(a.date));
  if(!list.length) return `<div class="empty"><div class="mark">✒</div>
    <h3>Nothing to look back on yet</h3><p>${esc(cfg.blank)}</p></div>`;

  const years = {};
  list.forEach(e => (years[e.date.slice(0,4)] = years[e.date.slice(0,4)] || []).push(e));
  const c = col(cfg.accent);

  return Object.keys(years).sort((a,b) => b - a).map(y => `
    <div class="sec-label">${esc(y)} · ${years[y].length}</div>
    <div class="stones">${years[y].map(e => `
      <button class="stone" style="--c:${c}" data-jopen="${k}:${esc(e.id)}">
        <div class="dt">${parse(e.date).getDate()} ${MON3[parse(e.date).getMonth()]}</div>
        <div class="ti">${esc(e.title)}</div>
        ${e.description ? `<div class="sn">${esc(e.description)}</div>` : ''}
      </button>`).join('')}</div>`).join('');
}

function renderJournal(k){
  const lens = S.lens[k];
  return lens === 'book' ? renderBook(k) : lens === 'stones' ? renderStones(k) : renderJCalendar(k);
}

/* ============================================================
   Journal entry editor — date, title, description. Nothing else,
   because nothing else was asked for.
   ============================================================ */
function openEntryEditor(k, entry, presetDate){
  const cfg = JOURNALS[k];
  S.jDraft = entry
    ? { ...entry, k }
    : { k, id:null, date: validDate(presetDate) ? presetDate : todayISO(), title:'', description:'' };
  const d = S.jDraft;
  openSheet(`
    <h2>${d.id ? 'Edit' : cfg.verb} ${d.id ? 'this page' : (k==='diary' ? 'a page' : 'an intention')}</h2>
    <p class="hint">${esc(cfg.prompt)}</p>
    <div class="field"><label for="j-date">When</label>
      <input id="j-date" type="date" value="${esc(d.date)}"></div>
    <div class="field"><label for="j-title">Title</label>
      <input id="j-title" type="text" autocomplete="off" placeholder="${k==='diary'?'A quiet Sunday':'Run a half marathon'}"
             value="${esc(d.title)}" maxlength="120"></div>
    <div class="field"><label for="j-desc">Description</label>
      <textarea id="j-desc" autocomplete="off" rows="7" placeholder="Take as much room as you like.">${esc(d.description)}</textarea></div>
    <div class="btn-row">
      ${d.id ? `<button class="btn btn-danger" data-jdel="${k}:${esc(d.id)}">Delete</button>`
             : `<button class="btn btn-ghost" data-close="1">Cancel</button>`}
      <button class="btn btn-primary" data-jsave="1">${d.id ? 'Save changes' : 'Save'}</button>
    </div>`);
  setTimeout(() => { if(!d.id) $('#j-title')?.focus(); }, 340);
}

function saveEntry(){
  if(!S.jDraft) return;
  const d = S.jDraft, k = d.k;
  if(!isJournal(k)){ closeSheet(); return; }
  const date = $('#j-date')?.value || d.date;
  const title = cleanText($('#j-title')?.value ?? d.title, CAP.title);
  const description = cleanText($('#j-desc')?.value ?? d.description, CAP.desc);
  if(!title){ toast('Give it a title first'); $('#j-title')?.focus(); return; }
  if(!validDate(date)){ toast('Pick a valid date'); return; }
  const now = Date.now();
  if(d.id){
    const i = S.journals[k].findIndex(e => e.id === d.id);
    if(i < 0){ toast('That page no longer exists'); closeSheet(); render(); return; }
    S.journals[k][i] = { ...S.journals[k][i], date, title, description, updated:now };
    toast('Saved');
  } else {
    if(S.journals[k].length >= MAX_EVENTS){ toast('This device is at its limit'); return; }
    const e = { id:uid(), date, title, description, created:now, updated:now };
    S.journals[k].push(e);
    S.jCursor[k] = parse(date);
    S.jPage[k] = jSorted(k).findIndex(x => x.id === e.id);
    toast(k === 'diary' ? 'Page written' : 'Intention set');
  }
  saveJournal(k); closeSheet(); render(); haptic();
}

function deleteEntry(k, id){
  if(!confirm('Delete this page? This cannot be undone.')) return;
  S.journals[k] = S.journals[k].filter(e => e.id !== id);
  if(S.jPage[k] >= S.journals[k].length) S.jPage[k] = Math.max(0, S.journals[k].length - 1);
  saveJournal(k); closeSheet(); render(); toast('Deleted');
}
