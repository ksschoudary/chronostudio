    <p class="hint">${n} record${n===1?'':'s'} · saved to your device, never uploaded</p>
    <button class="srow" data-xp="${scope}:json"><span class="ic">⤓</span>
      <div style="flex:1"><div class="tt">Backup (.json)</div>
      <div class="ts">Complete, and can be imported back into Chrono</div></div></button>
    <button class="srow" data-xp="${scope}:md"><span class="ic">✎</span>
      <div style="flex:1"><div class="tt">Readable notes (.md)</div>
      <div class="ts">For reading, printing or pasting anywhere</div></div></button>
    <button class="srow" data-xp="${scope}:csv"><span class="ic">▦</span>
      <div style="flex:1"><div class="tt">Spreadsheet (.csv)</div>
      <div class="ts">Opens in Numbers, Excel or Sheets</div></div></button>
    ${scope === 'all' ? `<button class="srow" data-act="import"><span class="ic">⤒</span>
      <div style="flex:1"><div class="tt">Import a backup</div>
      <div class="ts">Merges with what is already here</div></div></button>` : ''}
    <div class="btn-row"><button class="btn btn-ghost" data-close="1">Close</button></div>`);
}

function exportScope(scope, fmt){
  const s = SCOPES[scope] || SCOPES.all;
  const stamp = todayISO();
  if(fmt === 'json'){
    const payload = { app:'Chrono Studio', version:2, scope, exported:new Date().toISOString() };
    if(scope === 'all' || scope === 'timeline'){ payload.categories = S.cats; payload.events = S.events; }
    if(scope === 'all' || scope === 'diary')    payload.diary = S.journals.diary;
    if(scope === 'all' || scope === 'manifest') payload.manifest = S.journals.manifest;
    if(scope === 'all' || scope === 'habit'){ payload.habits = S.habits; payload.habitLog = S.hlog; }
    download(`${s.file}-${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json');
    return;
  }
  if(fmt === 'md'){
    let out = `# Chrono Studio — ${s.label}\n\n_exported ${longDate(stamp)}_\n`;
    if(scope === 'all' || scope === 'timeline') out += timelineMD();
    if(scope === 'all' || scope === 'diary')    out += journalMD('diary');
    if(scope === 'all' || scope === 'manifest') out += journalMD('manifest');
    if(scope === 'all' || scope === 'habit')    out += habitsMD();
    download(`${s.file}-${stamp}.md`, out, 'text/markdown');
    return;
  }
  const rows = [];
  if(scope === 'all' || scope === 'timeline'){
    rows.push(['Section','Date','Title','Category','About','Description','Milestone']);
    S.events.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(e =>
      rows.push(['Timeline', e.date, e.title, catOf(e.catId).name, e.about, e.description, e.milestone?'Yes':'No']));
  }
  ['diary','manifest'].forEach(k => {
    if(scope !== 'all' && scope !== k) return;
    if(!rows.length) rows.push(['Section','Date','Title','Category','About','Description','Milestone']);
    jSorted(k).forEach(e => rows.push([JOURNALS[k].name, e.date, e.title, '', '', e.description, '']));
  });
  if(scope === 'all' || scope === 'habit'){
    if(!rows.length) rows.push(['Section','Date','Title','Category','About','Description','Milestone']);
    Object.keys(S.hlog).sort().forEach(day => S.hlog[day].forEach(id => {
      const hb = S.habits.find(x => x.id === id);
      if(hb) rows.push(['Habits', day, hb.name, '', hb.time, 'Done', '']);
    }));
  }
  if(!rows.length) rows.push(['Section','Date','Title','Category','About','Description','Milestone']);
  download(`${s.file}-${stamp}.csv`, toCSV(rows), 'text/csv');
}

function timelineMD(){
  const list = S.events.slice().sort((a,b) => a.date.localeCompare(b.date));
  if(!list.length) return '\n\n## Timeline\n\n_nothing recorded_\n';
  let out = '\n\n## Timeline\n', y = null, m = null;
  list.forEach(e => {
    const d = parse(e.date);
    if(d.getFullYear() !== y){ y = d.getFullYear(); m = null; out += `\n### ${y}\n`; }
    if(d.getMonth() !== m){ m = d.getMonth(); out += `\n#### ${MON[m]}\n`; }
    out += `\n**${e.date} — ${e.title}**${e.milestone ? ' ★' : ''}  \n`;
    out += `_${catOf(e.catId).name}${e.about ? ' · ' + e.about : ''}_  \n`;
    if(e.description) out += `${e.description}\n`;
  });
  return out;
}

function habitsMD(){
  if(!S.habits.length) return '\n\n## Habits\n\n_none yet_\n';
  let out = '\n\n## Habits\n';
  S.habits.forEach(hb => {
    const st = habitStats(hb);
    out += `\n**${hb.name}**${hb.time ? ' · ' + hb.time : ''}  \n`;
    out += `_${hb.days.length === 7 ? 'every day' : hb.days.map(i => DOW_FULL[i]).join(', ')} · `;
    out += `${st.cur} running · best ${st.best} · ${st.done} of ${st.due} kept (${st.rate}%)_  \n`;
    if(hb.note) out += `${hb.note}\n`;
    const days = Object.keys(S.hlog).filter(d => S.hlog[d].includes(hb.id)).sort();
    if(days.length) out += `\nKept on: ${days.join(', ')}\n`;
  });
  return out;
}

function journalMD(k){
  const list = jSorted(k);
  if(!list.length) return `\n\n## ${JOURNALS[k].name}\n\n_nothing written_\n`;
  let out = `\n\n## ${JOURNALS[k].name}\n`, y = null;
  list.forEach(e => {
    const d = parse(e.date);
    if(d.getFullYear() !== y){ y = d.getFullYear(); out += `\n### ${y}\n`; }
    out += `\n**${e.date} — ${e.title}**  \n`;
    if(e.description) out += `${e.description}\n`;
  });
  return out;
}

/* A cell beginning = + - @ or a control char is executed as a formula by
   Excel, Numbers and Sheets. Prefixing with an apostrophe forces text. */
function toCSV(rows){
  const RISKY = /^[=+\-@\t\r]/;
  const q = v => {
    let s = String(v == null ? '' : v);
    if(RISKY.test(s)) s = "'" + s;
    return `"${s.replace(/"/g,'""')}"`;
  };
  return rows.map(r => r.map(q).join(',')).join('\r\n');
}

/* ============================================================
   Habits
   Model: a habit knows its name, note, time and which weekdays it
   is scheduled for. Completion lives in a separate log keyed by
   date, so a day's ticks are one lookup and history is compact.
   Tone is deliberate — nothing here scolds you. A missed day is
   just an empty box, and today staying unticked does not break a
   streak until the day is actually over.
   ============================================================ */

function applyTheme(id){
  const t = THEMES.some(x => x.id === id) ? id : 'studio';
  S.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  // Keep the iOS status bar and task-switcher card in step with the app.
  try{
    const meta = document.querySelector('meta[name="theme-color"]');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if(meta && /^#[0-9A-Fa-f]{6}$/.test(bg)) meta.setAttribute('content', bg);
  }catch(e){}

}

const K_HAB = 'chrono.habits.v1';
const MAX_HABITS = 30;
const DOW_FULL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function cleanHabit(h){
  if(!h || typeof h !== 'object' || Array.isArray(h)) return null;
  const name = cleanText(h.name, CAP.name * 2);
  if(!name) return null;
  let days = Array.isArray(h.days)
    ? [...new Set(h.days.map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6))]
    : [0,1,2,3,4,5,6];
  if(!days.length) days = [0,1,2,3,4,5,6];
  return {
    id: RX_ID.test(h.id) ? h.id : uid(),
    name,
    note: cleanText(h.note, CAP.about * 2),
    time: /^([01]\d|2[0-3]):[0-5]\d$/.test(h.time) ? h.time : '',
    days: days.sort(),
    color: RX_COLOR.test(h.color) ? h.color : SWATCHES[0],
    since: validDate(h.since) ? h.since : todayISO(),
    created: Number.isFinite(+h.created) ? +h.created : Date.now()
  };
}

/* The log is { 'YYYY-MM-DD': [habitId, ...] } — dates and ids both validated. */
function cleanLog(raw, ids){
  const out = {};
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  Object.keys(raw).slice(0, 4000).forEach(k => {
    if(!validDate(k) || !Array.isArray(raw[k])) return;
    const list = [...new Set(raw[k].filter(id => RX_ID.test(id) && ids.has(id)))].slice(0, MAX_HABITS);
    if(list.length) out[k] = list;
  });
  return out;
}

function loadHabits(){
  let raw = null;
  try { raw = JSON.parse(Store.get(K_HAB) || 'null'); } catch(e){ raw = null; }
  const habits = (Array.isArray(raw && raw.habits) ? raw.habits : [])
    .slice(0, MAX_HABITS).map(cleanHabit).filter(Boolean);
  const seen = new Set();
  S.habits = habits.filter(h => seen.has(h.id) ? false : seen.add(h.id));
  S.hlog = cleanLog(raw && raw.log, seen);
  bumpStats();
}
function saveHabits(){
  bumpStats();
  if(!Store.set(K_HAB, JSON.stringify({ habits:S.habits, log:S.hlog })))
    toast('Could not save — storage is full. Export a backup.');
}

const isDone   = (id, day) => !!(S.hlog[day] && S.hlog[day].includes(id));
const dueOn    = (h, d)    => h.days.includes(d.getDay());
const habitsOn = d => S.habits.filter(h => dueOn(h, d) && h.since <= iso(d));

function toggleHabit(id, day){
  // Validated here as well as at the call site: `day` becomes an object key, and
  // an unchecked key such as __proto__ would reach the prototype chain.
  if(!RX_ID.test(id) || !validDate(day)) return;
  if(!S.habits.some(x => x.id === id)) return;
  const list = Object.prototype.hasOwnProperty.call(S.hlog, day) ? S.hlog[day] : [];
  if(!Array.isArray(list)) { delete S.hlog[day]; return; }
  S.hlog[day] = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  if(!S.hlog[day].length) delete S.hlog[day];
  saveHabits(); haptic();
}

/* One walk from the habit's start date to today gives current streak,
   best streak and the overall hit rate.

   Memoised, because every render draws a row per habit and each row wants
   these figures — without the cache, ticking one box re-walks years of
   history for every habit before the screen redraws. The version counter is
   bumped by saveHabits(), which every mutation path already calls, and the
   key carries today's date so the cache cannot survive midnight. */
let _statsVer = 0;
const _statsCache = new Map();
const bumpStats = () => { _statsVer++; _statsCache.clear(); };

/* The cache is emptied at the start of every render and by every save, so it
   only ever serves repeat lookups inside one synchronous render pass — during
   which nothing can mutate. That makes stale results impossible rather than
   unlikely, which a content fingerprint could not guarantee: any cheap hash of
   the log can collide, and a silently wrong streak is worse than a slow one. */
function habitStats(h){
  const ck = `${h.id}|${h.since}|${h.days.join('')}|${_statsVer}|${todayISO()}`;
  const hit = _statsCache.get(ck);
  if(hit) return hit;
  const out = computeHabitStats(h);
  if(_statsCache.size > 200) _statsCache.clear();
  _statsCache.set(ck, out);
  return out;
}

function computeHabitStats(h){
  const end = new Date(); end.setHours(12,0,0,0);
  const d = parse(h.since);
  const today = todayISO();
  let cur = 0, best = 0, done = 0, due = 0, guard = 0;
  while(d <= end && guard++ < 3000){
    const key = iso(d);
    if(dueOn(h, d)){
      due++;
      if(isDone(h.id, key)){ done++; cur++; if(cur > best) best = cur; }
      else if(key !== today) cur = 0;      // an unfinished today is not a miss yet
    }
    d.setDate(d.getDate() + 1);
  }
  return { cur, best, done, due, rate: due ? Math.round(done/due*100) : 0 };
}

function dayRatio(day){
  const d = parse(day);
  const due = habitsOn(d);
  if(!due.length) return null;
  const done = due.filter(h => isDone(h.id, day)).length;
  return { done, due: due.length, pct: Math.round(done/due.length*100) };
}

/* ---------- Habit lens 1: Today ---------- */
function renderToday(){
  if(!S.habits.length) return `<div class="empty"><div class="mark">◈</div>
    <h3>No habits yet</h3>
    <p>Add one and it will show up here each day it is due, with a ring that fills as you go.</p>
    <button data-hadd="1">Add a habit</button></div>`;

  const day = todayISO();
  const d = new Date();
  const due = habitsOn(d);
  const done = due.filter(h => isDone(h.id, day));

  // One ring divided into equal segments, one per habit due today.
  const R = 78, C = 2 * Math.PI * R, n = Math.max(1, due.length);
  const gap = n === 1 ? 0 : Math.min(9, C / n * 0.16);
  const seg = C / n - gap;
  const arcs = due.map((h, i) => {
    const filled = isDone(h.id, day);
    return `<circle r="${R}" cx="93" cy="93" data-hid="${esc(h.id)}" data-col="${col(h.color)}"
      stroke="${filled ? col(h.color) : 'var(--surface-2)'}"
      stroke-width="15" stroke-dasharray="${seg.toFixed(2)} ${(C-seg).toFixed(2)}"
      stroke-dashoffset="${(-i * C / n).toFixed(2)}"
      opacity="${filled ? 1 : .55}"></circle>`;
  }).join('');

  const pct = due.length ? Math.round(done.length/due.length*100) : 0;
  const note = !due.length
    ? 'Nothing scheduled today. Rest is part of it.'
    : done.length === due.length
      ? 'All done for today.'
      : `${due.length - done.length} still open. No rush.`;

  const rows = due.length
    ? due.map(h => habitRow(h, day)).join('')
    : `<p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:8px">
         Your habits are scheduled for other days this week.</p>`;

  const others = S.habits.filter(h => !due.some(x => x.id === h.id));

  return `<div class="ringwrap">
      <svg class="ring" viewBox="0 0 186 186" aria-hidden="true">
        ${due.length ? '' : `<circle class="track" r="${R}" cx="93" cy="93" stroke-width="15"></circle>`}
        ${arcs}
      </svg>
      <div class="ringcap">
        <b>${done.length}<span>/${due.length}</span></b>
        <em>${pct}% of today</em>
      </div>
    </div>
    <p class="ringnote">${esc(note)}</p>
    <div class="sec-label">Due today</div>
    <div class="stack">${rows}</div>
    ${others.length ? `<div class="sec-label">Not scheduled today</div>
      <div class="stack">${others.map(h => habitRow(h, day, true)).join('')}</div>` : ''}`;
}

/* One source of truth for a habit row's sub-line, so the in-place patch can
   never disagree with what a full render would have produced. */
function habitSubline(h){
  const st = habitStats(h);
  const bits = [];
  if(h.time) bits.push(esc(h.time));
  if(st.cur > 0) bits.push(`<b>${st.cur} day${st.cur===1?'':'s'} running</b>`);
  else if(st.best > 0) bits.push(`best ${st.best}`);
  if(h.days.length < 7) bits.push(h.days.map(i => DOW_FULL[i][0]).join(''));
  return bits.join(' · ') || (h.note ? esc(h.note) : 'Every day');
}

function habitRow(h, day, muted){
  const done = isDone(h.id, day);
  return `<div class="hrow${done?' done':''}" data-hrow="${esc(h.id)}" style="--c:${col(h.color)}${muted?';opacity:.6':''}">
    <button class="tick" data-htog="${esc(h.id)}:${esc(day)}" aria-pressed="${done}"
      aria-label="Mark ${esc(h.name)} done">✓</button>
    <button class="hmeta" data-hopen="${esc(h.id)}">
      <div class="hn">${esc(h.name)}</div>
      <div class="hs">${habitSubline(h)}</div>
    </button>
    <span class="hgo">›</span>
  </div>`;
}

/* ---------- Habit lens 2: the week ---------- */

/* Weeks run Monday to Sunday, matching how most people read a week. */
function weekDays(anchor){
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate(), 12);
  const start = new Date(a); start.setDate(a.getDate() - ((a.getDay() + 6) % 7));
  return Array.from({ length:7 }, (_,i) => {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12);
    return { d, key: iso(d) };
  });
}

/* Every figure the weekly screen shows, computed once from the model.
   The renderer and the in-place patcher both read this, so they cannot
   drift apart — which they did when each derived the numbers its own way. */
function weekFigures(days){
  const today = todayISO();
  const perDay = [0,0,0,0,0,0,0];
  let kept = 0, due = 0;

  const rows = S.habits.map(hb => {
    const cells = days.map((x, i) => {
      const scheduled = dueOn(hb, x.d) && hb.since <= x.key;
      const future = x.key > today;
      const on = isDone(hb.id, x.key);
      const counts = scheduled && !future;      // a day that can be "met"
      if(on) perDay[i]++;                        // best-day counts every tick
      if(counts){ due++; if(on){ kept++; } }     // but met/kept only count due days
      return { key:x.key, on, future, scheduled, counts };
    });
    const rDue  = cells.filter(c => c.counts).length;
    const rKept = cells.filter(c => c.counts && c.on).length;
    // kept-of-due, never all-ticks-of-due: ticking a rest day used to produce
    // labels like "4 of 3" and a Met percentage above 100.
    return { habit:hb, cells, hit:rKept, due:rDue, perfect: rDue > 0 && rKept === rDue };
  });

  const total = Object.keys(S.hlog).reduce((n,k) => n + S.hlog[k].length, 0);
  const best = Math.max(0, ...S.habits.map(x => habitStats(x).best));
  return { rows, met: due ? Math.round(kept/due*100) : 0,
           bestDay: Math.max(0, ...perDay), total, best };
}

function renderWeek(){
  if(!S.habits.length) return `<div class="empty"><div class="mark">◈</div>
    <h3>Nothing to chart yet</h3><p>Add a habit and its week fills in here, one tile a day.</p>
    <button data-hadd="1">Add a habit</button></div>`;

  const days = weekDays(S.hWeek);
  const f = weekFigures(days);
  const today = todayISO();
  const dd = n => String(n).padStart(2,'0');
  const label = `${dd(days[0].d.getDate())}/${dd(days[0].d.getMonth()+1)} — ${dd(days[6].d.getDate())}/${dd(days[6].d.getMonth()+1)}`;

  const head = `<div class="wname"></div>` +
    days.map(x => `<div class="wh${x.key===today?' now':''}">${'MTWTFSS'[(x.d.getDay()+6)%7]}<i>${x.d.getDate()}</i></div>`).join('') +
    `<div class="wh"></div>`;

  const rows = f.rows.map(r => {
    const c = col(r.habit.color);
    const cells = r.cells.map(x => {
      const cls = [x.on ? 'on' : '', x.future ? 'future' : '',
                   (!x.scheduled && !x.future) ? 'off' : ''].filter(Boolean).join(' ');
      return `<button class="wcell ${cls}" style="--c:${c}" data-htog="${esc(r.habit.id)}:${esc(x.key)}"
        aria-label="${esc(r.habit.name)} on ${x.key}" aria-pressed="${x.on}"></button>`;
    }).join('');
    return `<button class="wname" style="--c:${c}" data-hopen="${esc(r.habit.id)}">${esc(r.habit.name)}<i>${r.hit} of ${r.due}</i></button>`
      + cells
      + `<div class="wbadge" style="--c:${c}">${r.perfect ? '<span class="perfect" title="Every scheduled day kept">★</span>' : ''}</div>`;
  }).join('');

  return `<div class="wk-head">
      <button class="nav-btn" data-hwk="-1" aria-label="Previous week">‹</button>
      <div class="wv">${label}<span>${days[6].d.getFullYear()}</span></div>
      <button class="today-btn" data-hwk="0">Today</button>
      <button class="nav-btn" data-hwk="1" aria-label="Next week">›</button>
    </div>
    <div class="wgrid">${head}${rows}</div>
    <div class="wstats">
      <div class="ws"><b style="color:var(--accent)">${f.met}<span>%</span></b><em>Met</em></div>
      <div class="ws"><b style="color:var(--c2)">${f.bestDay}</b><em>Best day</em></div>
      <div class="ws"><b style="color:var(--c3)">${f.total}</b><em>Total done</em></div>
      <div class="ws"><b style="color:var(--c4)">${f.best}<span>d</span></b><em>Best streak</em></div>
    </div>
    <p class="note" style="text-align:center">Tap any tile to change it. Empty tiles are just empty.</p>`;
}

/* ---------- Habit lens 3: completion calendar ---------- */
function renderHabitCal(){
  if(!S.habits.length) return `<div class="empty"><div class="mark">◈</div>
    <h3>No habits yet</h3><p>Once you have one, this month fills with a small dial for each day.</p>
    <button data-hadd="1">Add a habit</button></div>`;

  const cur = S.hCursor;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1, 12);
  const start = new Date(y, m, 1 - first.getDay(), 12);
  const today = todayISO();

  let cells = '', monthDone = 0, monthDue = 0;
  for(let i = 0; i < 42; i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12);
    const key = iso(d), out = d.getMonth() !== m;
    const r = key > today ? null : dayRatio(key);
    if(!out && r){ monthDone += r.done; monthDue += r.due; }
    const dial = r
      ? `<span class="dial${r.pct===100?' full':r.pct===0?' none':''}" style="--p:${r.pct}">
           <i>${r.done}</i></span>`
      : '';
    cells += `<button class="cell${r?' has':''}${out?' out':''}${key===today?' today':''}${key===S.hSel?' sel':''}" data-hday="${esc(key)}">
      <span class="n">${d.getDate()}</span>${dial}</button>`;
  }

  const rate = monthDue ? Math.round(monthDone/monthDue*100) : 0;
  const sel = S.hSel && S.hSel.startsWith(`${y}-${String(m+1).padStart(2,'0')}`) ? S.hSel : null;
  const selBlock = sel ? (() => {
    const d = parse(sel);
    const list = habitsOn(d);
    return `<div class="sec-label">${dayLabel(sel)} ${MON3[d.getMonth()]}</div>
      ${list.length ? `<div class="stack">${list.map(h => habitRow(h, sel)).join('')}</div>`
        : `<p style="font-size:12px;color:var(--text-3);text-align:center">Nothing was scheduled that day.</p>`}`;
  })() : '';

  return `<div class="cal-head">
      <button class="nav-btn" data-hmv="-1" aria-label="Previous month">‹</button>
      <div class="m">${MON[m]} <span>${y}</span></div>
      <button class="today-btn" data-hmv="0">Today</button>
      <button class="nav-btn" data-hmv="1" aria-label="Next month">›</button>
    </div>
    <div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="grid hcal">${cells}</div>
    <div class="sec-label">${monthDone} of ${monthDue} kept this month · ${rate}%</div>
    ${selBlock || `<p style="font-size:11.5px;color:var(--text-3);text-align:center">Tap a day to see it.</p>`}`;
}

function saveHabit(){
  if(!S.hDraft) return;
  syncHabit();
  const d = S.hDraft;
  const name = cleanText(d.name, CAP.name * 2);
  if(!name){ toast('Name the habit first'); $('#h-name')?.focus(); return; }
  if(!d.days.length){ toast('Pick at least one day'); return; }
  if(d.id){
    const i = S.habits.findIndex(x => x.id === d.id);
    if(i < 0){ toast('That habit no longer exists'); closeSheet(); render(); return; }
    S.habits[i] = cleanHabit({ ...S.habits[i], name, note:d.note, time:d.time, days:d.days, color:d.color });
    toast('Saved');
  } else {
    if(S.habits.length >= MAX_HABITS){ toast(`Chrono holds ${MAX_HABITS} habits`); return; }
    const h = cleanHabit({ ...d, id:uid(), name, since:todayISO() });
    if(!h){ toast('Could not save that'); return; }
    S.habits.push(h);
    toast('Habit added');
  }
  saveHabits(); closeSheet(); render(); haptic();
}

function deleteHabit(id){
  const h = S.habits.find(x => x.id === id);
  if(!h) return;
  if(!confirm(`Delete "${h.name}" and its history? This cannot be undone.`)) return;
  S.habits = S.habits.filter(x => x.id !== id);
  Object.keys(S.hlog).forEach(k => {
    S.hlog[k] = S.hlog[k].filter(x => x !== id);
    if(!S.hlog[k].length) delete S.hlog[k];
  });
  saveHabits(); closeSheet(); render(); toast('Deleted');
}

const SUBTITLE = { timeline:'on this device only', diary:'your pages', manifest:'what you are working toward',
                   habit:'kept, not scored', library:'your library' };

let _viewKey = '';

function render(){
  bumpStats();               // stats are memoised per render pass only
  const v = $('#view');
  const tab = S.tab;
  const key = `${tab}|${(S.lens && S.lens[tab]) || ''}|${S.query.trim() ? 'search' : ''}`;
  const same = key === _viewKey;
  const keep = same ? (window.scrollY || window.pageYOffset || 0) : 0;
  const onTimeline = tab === 'timeline';
  const journal = isJournal(tab);
  const searching = onTimeline && S.query.trim().length > 0;
  const hasLenses = !!LENSES[tab];

  // The lens bar is rebuilt per tab, because each section has its own set.
  if(hasLenses && !searching){
    const cur = S.lens[tab];
    $('#lens').innerHTML = LENSES[tab].map(([id,label]) =>
      `<button role="tab" data-lens="${esc(id)}" aria-selected="${id===cur}">${esc(label)}</button>`).join('');
    $('#lens').style.display = 'flex';
  } else {
    $('#lens').style.display = 'none';
  }

  $('#searchBtn').style.display = onTimeline ? 'grid' : 'none';
  $('#exportBtn').style.display = (onTimeline || journal || tab === 'habit') ? 'grid' : 'none';
  $('#searchRow').classList.toggle('on', onTimeline && S.searchOpen);
  $('#searchBtn').setAttribute('aria-pressed', String(S.searchOpen));
  $('#fabAdd').hidden = !(onTimeline || journal || tab === 'habit');
  $('#brandSub').textContent = SUBTITLE[tab] || '';
  document.querySelectorAll('.nav button[data-tab]').forEach(b => {
    if(b.dataset.tab === tab) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });
  renderChips();

  const lens = S.lens[tab];
  v.classList.remove('anim');
  v.innerHTML = WIP[tab] ? renderWIP(tab)
    : tab === 'library' ? renderLibrary()
    : tab === 'habit' ? renderHabits()
    : journal ? renderJournal(tab)
    : searching ? renderSearch()
    : lens === 'monthly' ? renderMonthly()
    : lens === 'tree' ? renderTree()
    : lens === 'map' ? renderMap()
    : renderCalendar();
  // Restore the reading position when only the data changed, and replay the
  // entrance stagger only when the view itself changed. Re-animating the whole
  // screen every time a box is ticked is what makes an app feel flimsy.
  if(same){
    if(keep) window.scrollTo(0, keep);
  } else {
    window.scrollTo(0, 0);
    void v.offsetWidth;        // force reflow so the stagger replays
    v.classList.add('anim');
  }
  _viewKey = key;
  S.flipDir = 1;
  measureHeader();             // section changes alter the header's height
}

/* A tick updates the tapped control immediately, then refreshes only the
   figures that depend on it. Nothing else in the tree is touched, so the
   response stays instant however much history is on screen. */
function patchTick(el, id, day){
  if(!el || !el.closest) return false;
  // Only the two screens whose derived figures we know how to recompute are
  // patched. Everywhere else (the habit calendar's dials, for instance) does a
  // full render, because a half-updated screen is worse than a slower one.
  const lens = S.lens && S.lens.habit;
  if(S.tab !== 'habit') return false;

  if(lens === 'week'){
    const cell = el.closest('.wcell');
    if(!cell) return false;
    const on = isDone(id, day);
    cell.classList.toggle('on', on);
    cell.setAttribute('aria-pressed', String(on));
    refreshWeek();
    return true;
  }

  if(lens === 'today'){
    const row = el.closest('.hrow');
    if(!row) return false;
    const on = isDone(id, day);
    row.classList.toggle('done', on);
    const tick = row.querySelector('.tick');
    if(tick) tick.setAttribute('aria-pressed', String(on));
    const sub = row.querySelector('.hs');
    const hb = S.habits.find(x => x.id === id);
    if(sub && hb) sub.innerHTML = habitSubline(hb);   // streak text must follow
    refreshRing();
    return true;
  }
  return false;
}

/* The ring, its caption and the note under it. */
function refreshRing(){
  const view = $('#view');
  if(!view.querySelector) return;
  const wrap = view.querySelector('.ringwrap');
  if(!wrap) return;
  const day = todayISO();
  const due = habitsOn(new Date());
  const done = due.filter(h => isDone(h.id, day)).length;
  (wrap.querySelectorAll('circle[data-hid]') || []).forEach(c => {
    const lit = isDone(c.getAttribute('data-hid'), day);
    c.setAttribute('stroke', lit ? col(c.getAttribute('data-col')) : 'var(--surface-2)');
    c.setAttribute('opacity', lit ? '1' : '.55');
  });
  const cap = wrap.querySelector('.ringcap');
  if(cap && due.length)
    cap.innerHTML = `<b>${done}<span>/${due.length}</span></b><em>${Math.round(done/due.length*100)}% of today</em>`;
  const note = view.querySelector('.ringnote');
  if(note) note.textContent = !due.length
    ? 'Nothing scheduled today. Rest is part of it.'
    : done === due.length ? 'All done for today.'
    : `${due.length - done} still open. No rush.`;
}

/* Refresh the weekly screen's derived text from weekFigures — the same
   function the renderer uses, so a patched screen and a rendered one always
   agree by construction rather than by two implementations staying in step. */
function refreshWeek(){
  const view = $('#view');
  if(!view.querySelector) return;
  const box = view.querySelector('.wstats');
  if(!box) return;
  const f = weekFigures(weekDays(S.hWeek));
  const names  = [...(view.querySelectorAll('.wgrid button.wname') || [])];
  const badges = [...(view.querySelectorAll('.wgrid .wbadge') || [])];

  f.rows.forEach((r, i) => {
    const label = names[i] && names[i].querySelector('i');
    if(label) label.textContent = `${r.hit} of ${r.due}`;
    const badge = badges[i];
    if(badge){
      const has = !!badge.querySelector('.perfect');
      if(r.perfect && !has) badge.innerHTML = '<span class="perfect" title="Every scheduled day kept">★</span>';
      else if(!r.perfect && has) badge.innerHTML = '';
    }
  });

  const vals = [`${f.met}<span>%</span>`, String(f.bestDay), String(f.total), `${f.best}<span>d</span>`];
  (box.querySelectorAll('.ws b') || []).forEach((b, i) => { if(vals[i] !== undefined) b.innerHTML = vals[i]; });
}

/* Publish the sticky header's height so scroll targets can clear it. */
function measureHeader(){
  try{
    const hd = document.querySelector('header.topbar');
    if(hd && hd.getBoundingClientRect){
      const px = Math.round(hd.getBoundingClientRect().height);
      if(px > 40 && px < 600)
        document.documentElement.style.setProperty('--head-h', px + 'px');
    }
  }catch(e){}
}
if(window.addEventListener){
  window.addEventListener('resize', measureHeader);
  window.addEventListener('orientationchange', () => setTimeout(measureHeader, 300));
}

/* The header only casts a shadow once something has scrolled beneath it. */
(function(){
  const app = $('#app');
  if(!app || !window.addEventListener) return;
  let on = false;
  window.addEventListener('scroll', () => {
    const now = (window.scrollY || window.pageYOffset || 0) > 2;
    if(now !== on){ on = now; app.classList.toggle('scrolled', on); }
  }, { passive:true });
})();

/* Lift bottom sheets above the on-screen keyboard instead of letting iOS
   shove the layout around underneath them. */
(function(){
  const vv = window.visualViewport;
  if(!vv || !vv.addEventListener) return;
  const sync = () => {
    const raw = window.innerHeight - vv.height - vv.offsetTop;
    // Numeric by construction, but clamped anyway: this value reaches a CSS
    // custom property, and a NaN would silently mis-size every bottom sheet.
    const kb = Number.isFinite(raw) ? Math.min(Math.max(0, Math.round(raw)), 900) : 0;
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', sync);
  sync();
})();

/* ============================================================
   Sheets
   ============================================================ */
/* iOS ignores overflow:hidden on <body> for touch scrolling, so the page is
   pinned at its current offset instead and restored exactly on close. */
let _lockY = 0;
function openSheet(html){
  _lockY = window.scrollY || window.pageYOffset || 0;
  $('#sheet').innerHTML = `<div class="grab"></div>` + html;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  const b = document.body.style;
  b.position = 'fixed'; b.top = `-${_lockY}px`; b.left = '0'; b.right = '0'; b.width = '100%';
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  const b = document.body.style;
  b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = '';
  if(_lockY) window.scrollTo(0, _lockY);
  // All three, or a closed editor's draft outlives its sheet and can be
  // resurrected by a later click while a different editor is open.
  S.draft = null; S.jDraft = null; S.hDraft = null;
}

        ${S.cats.map(c => `<button data-pick="${esc(c.id)}" aria-pressed="${d.catId===c.id}" style="--c:${col(c.color)}">
          <span class="dot"></span>${esc(c.name)}</button>`).join('')}
        <button class="new" data-newcat="1">＋ New</button>
      </div>
      <div class="newcat" id="newCat">
        <input id="f-newcat" type="text" autocomplete="off" placeholder="Category name" maxlength="18">
        <button class="btn btn-primary" style="flex:0 0 auto;padding:9px 16px" data-addcat="1">Add</button>
      </div>
      <div class="swatches" id="swatches" style="display:none">
        ${SWATCHES.map(s => `<button data-sw="${s}" style="background:${s}" aria-pressed="${d.newColor===s}"></button>`).join('')}
      </div>
    </div>
    <div class="toggle-row">
      <div><div class="tt">Mark as a milestone</div><div class="ts">Milestones become stops on your map</div></div>
      <button class="switch" id="msToggle" aria-pressed="${!!d.milestone}"><i></i></button>
    </div>
    <div class="btn-row">
      ${d.id ? `<button class="btn btn-danger" data-del="${esc(d.id)}">Delete</button>` : `<button class="btn btn-ghost" data-close="1">Cancel</button>`}
      <button class="btn btn-primary" data-save="1">${d.id ? 'Save changes' : 'Save event'}</button>
    </div>`);
  setTimeout(() => { if(!d.id) $('#f-title')?.focus(); }, 340);
}

function syncDraft(){
  const d = S.draft; if(!d) return;
  d.date = $('#f-date')?.value || d.date;
  d.title = $('#f-title')?.value ?? d.title;
  d.about = $('#f-about')?.value ?? d.about;
  d.description = $('#f-desc')?.value ?? d.description;
}

function openDetail(id){
  const e = S.events.find(x => x.id === id); if(!e) return;
  const c = catOf(e.catId);
  openSheet(`<div class="det" style="--c:${col(c.color)}">
    <span class="det-cat"><span style="width:7px;height:7px;border-radius:50%;background:${col(c.color)};display:inline-block"></span>${esc(c.name)}</span>
    ${e.milestone ? '<span class="det-cat" style="margin-left:6px">★ Milestone</span>' : ''}
    <h2>${esc(e.title)}</h2>
    <div class="det-date">${longDate(e.date)}${e.about ? ' · ' + esc(e.about) : ''}</div>
    ${e.description ? `<div class="block"><h5>What happened</h5><p>${esc(e.description)}</p></div>` : ''}
    <div class="btn-row">
      <button class="btn btn-ghost" data-close="1">Close</button>
      <button class="btn btn-primary" data-edit="${esc(e.id)}">Edit</button>
    </div></div>`);
}

/* ============================================================
   Actions
   ============================================================ */
function saveDraft(){
  if(!S.draft) return;
  syncDraft();
  const d = S.draft;
  const title = cleanText(d.title, CAP.title);
  if(!title){ toast('Give it a title first'); $('#f-title')?.focus(); return; }
  if(!validDate(d.date)){ toast('Pick a valid date'); return; }
  if(!S.cats.some(c => c.id === d.catId)) d.catId = S.cats[0].id;
  const about = cleanText(d.about, CAP.about);
  const description = cleanText(d.description, CAP.desc);
  const now = Date.now();
  if(d.id){
    const i = S.events.findIndex(e => e.id === d.id);
    if(i < 0){ toast('That event no longer exists'); closeSheet(); render(); return; }
    S.events[i] = { ...S.events[i], date:d.date, title, about, description,
                    catId:d.catId, milestone:!!d.milestone, updated:now };
    toast('Saved');
  } else {
    if(S.events.length >= MAX_EVENTS){ toast('This device is at its event limit'); return; }
    S.events.push({ id:uid(), date:d.date, title, about, description,
                    catId:d.catId, milestone:!!d.milestone, created:now, updated:now });
    toast('Event recorded');
    S.cursor = parse(d.date);
  }
  saveEvents(); closeSheet(); render(); haptic();
}

function deleteEvent(id){
  if(!confirm('Delete this event? This cannot be undone.')) return;
  S.events = S.events.filter(e => e.id !== id);
  saveEvents(); closeSheet(); render(); toast('Deleted');
}

function download(name, text, type){
  try{
    const b = new Blob([text], { type });
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 800);
    toast('Exported ' + name);
  }catch(e){
    // Silently copying a whole journal to the clipboard would let any other
    // app read it, so this is never done without asking.
    if(confirm('The download was blocked. Copy the backup to your clipboard instead?\n\nAnything on your clipboard can be read by other apps until you copy something else.')){
      navigator.clipboard?.writeText(text)
        .then(() => toast('Copied to clipboard'))
        .catch(() => toast('Could not export on this device'));
    } else {
      toast('Export cancelled');
    }
  }
}

function importJSON(file){
  if(file.size > MAX_IMPORT_BYTES){ toast('That file is too large to be a Chrono backup'); return; }
  const r = new FileReader();
  r.onerror = () => toast("Could not read that file");
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); }
    catch(e){ toast("That file isn't a Chrono backup"); return; }

    const rawEvents = Array.isArray(data) ? data : (data && Array.isArray(data.events) ? data.events : null);
    const rawCats   = (data && data.categories) || [];
    const hasJournal = data && (Array.isArray(data.diary) || Array.isArray(data.manifest));
    const hasHabits = data && Array.isArray(data.habits);
    // A section-only export carries no events array, so accept any known section.
    if(!rawEvents && !hasJournal && !hasHabits){ toast("That file isn't a Chrono backup"); return; }

    let added = 0, newCats = 0, rejected = 0;
    if(rawEvents){
      const clean = normaliseAll([...S.cats, ...(Array.isArray(rawCats) ? rawCats : [])], rawEvents);
      rejected = Math.min(rawEvents.length, MAX_EVENTS) - clean.events.length;

      const knownCats = new Set(S.cats.map(c => c.id));
      clean.cats.forEach(c => {
        if(knownCats.has(c.id) || S.cats.length >= MAX_CATS) return;
        S.cats.push(c); newCats++;
      });

      const have = new Set(S.events.map(e => e.id));
      clean.events.forEach(e => {
        if(have.has(e.id)) return;                 // same id = already have it
        if(S.events.length >= MAX_EVENTS) return;
        have.add(e.id); S.events.push(e); added++;
      });
      saveCats(); saveEvents();
    }

    // Diary and manifestation entries ride in the same file, validated the same way.
    const jAdded = {};
    Object.keys(JOURNALS).forEach(k => {
      if(!data || !Array.isArray(data[k])) return;
      const incoming = normaliseEntries(data[k]);
      rejected += Math.min(data[k].length, MAX_EVENTS) - incoming.length;
      const seen = new Set(S.journals[k].map(e => e.id));
      let n = 0;
      incoming.forEach(e => {
        if(seen.has(e.id) || S.journals[k].length >= MAX_EVENTS) return;
        seen.add(e.id); S.journals[k].push(e); n++;
      });
      if(n){ saveJournal(k); jAdded[k] = n; }
    });

    // Habits travel with their log; both are validated before anything is kept.
    let habAdded = 0, logAdded = 0;
    if(data && Array.isArray(data.habits)){
      const known = new Set(S.habits.map(x => x.id));
      data.habits.slice(0, MAX_HABITS).forEach(raw => {
        const hb = cleanHabit(raw);
        if(!hb || known.has(hb.id) || S.habits.length >= MAX_HABITS) return;
        known.add(hb.id); S.habits.push(hb); habAdded++;
      });
      const incomingLog = cleanLog(data.habitLog, new Set(S.habits.map(x => x.id)));
      Object.keys(incomingLog).forEach(day => {
        const merged = new Set([...(S.hlog[day] || []), ...incomingLog[day]]);
        if(merged.size !== (S.hlog[day] || []).length) logAdded++;
        S.hlog[day] = [...merged];
      });
      if(habAdded || logAdded) saveHabits();
    }

    render();
    const bits = [];
    if(added) bits.push(`${added} event${added===1?'':'s'}`);
    Object.keys(jAdded).forEach(k => bits.push(`${jAdded[k]} ${JOURNALS[k].name.toLowerCase()}`));
    if(habAdded) bits.push(`${habAdded} habit${habAdded===1?'':'s'}`);
    if(logAdded) bits.push(`${logAdded} logged day${logAdded===1?'':'s'}`);
    if(newCats) bits.push(`${newCats} categor${newCats===1?'y':'ies'}`);
    let msg = bits.length ? 'Added ' + bits.join(' · ') : 'Nothing new to add';
    if(rejected > 0) msg += ` · ${rejected} skipped as invalid`;
    toast(msg);
  };
  r.readAsText(file);
}

/* ============================================================
   Wiring
   ============================================================ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-lens],[data-cat],[data-mv],[data-day],[data-year],[data-map],[data-ev],[data-tab],[data-save],[data-close],[data-del],[data-edit],[data-pick],[data-newcat],[data-addcat],[data-sw],[data-act],[data-delcat],[data-open-add],[data-add-on],[data-mon],[data-yr],[data-jday],[data-jmv],[data-jflip],[data-jopen],[data-jsave],[data-jdel],[data-xp],[data-xs],[data-htog],[data-hopen],[data-hadd],[data-hwk],[data-hmv],[data-hday],[data-hday-pick],[data-hcol],[data-hsave],[data-hdel],[data-theme-pick]');
  if(!t) return;
  const d = t.dataset;

  if(d.lens){ S.lens[S.tab] = d.lens; render(); return; }

  // Monthly ribbon
  if(d.mon !== undefined){
    const m = +d.mon, yy = S.cursor.getFullYear();
    S.cursor = new Date(yy, m, 1, 12);
    render(); haptic();
    const block = document.getElementById(`m-${yy}-${m}`);
    if(block) block.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  if(d.yr){
    S.cursor = new Date(S.cursor.getFullYear() + (+d.yr), S.cursor.getMonth(), 1, 12); render(); return;
  }

  // Journals
  if(d.jmv){
    const [k, n] = d.jmv.split(':');
    if(!isJournal(k)) return;
    S.jCursor[k] = (+n === 0) ? new Date()
      : new Date(S.jCursor[k].getFullYear(), S.jCursor[k].getMonth() + (+n), 1, 12);
    render(); return;
  }
  if(d.jday){
    const [k, day] = d.jday.split(':');
    if(!isJournal(k) || !validDate(day)) return;
    const hit = S.journals[k].find(e => e.date === day);
    if(hit) openEntryEditor(k, hit);
    else openEntryEditor(k, null, day);   // seeded before the sheet is drawn
    return;
  }
  if(d.jflip){
    const [k, n] = d.jflip.split(':');
    if(!isJournal(k)) return;
    const len = S.journals[k].length;
    const next = Math.min(Math.max(0, S.jPage[k] + (+n)), Math.max(0, len - 1));
    if(next === S.jPage[k]) return;
    S.flipDir = +n; S.jPage[k] = next; render(); haptic(); return;
  }
  if(d.jopen){
    const [k, id] = d.jopen.split(':');
    if(!isJournal(k)) return;
    const e = jEntry(k, id);
    if(!e){ toast('That page no longer exists'); render(); return; }
    openEntryEditor(k, e); return;
  }
  if(d.jsave){ saveEntry(); return; }
  if(d.jdel){
    const i = d.jdel.indexOf(':');
    deleteEntry(d.jdel.slice(0, i), d.jdel.slice(i + 1)); return;
  }

  // Export
  if(d.xs){ openExportSheet(d.xs); return; }
  if(d.xp){
    const [scope, fmt] = d.xp.split(':');
    exportScope(scope, fmt); closeSheet(); return;
  }
  if(d.cat){ S.cat = d.cat; render(); return; }
  if(d.mv !== undefined){
    const n = +d.mv;
    if(n === 0){ S.cursor = new Date(); S.selDay = todayISO(); }
    else S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth() + n, 1, 12);
    render(); return;
  }
  if(d.day){
    S.selDay = S.selDay === d.day ? null : d.day;
    const had = S.selDay;
    render();
    if(had){
      const el = document.getElementById('d-' + had);
      if(el){ el.classList.add('flash'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
    }
    return;
  }
  if(d.addOn){
    openEditor({ id:null, date:d.addOn, title:'', description:'', about:'', catId:S.cats[0].id, milestone:false });
    return;
  }
  if(d.year){ S.openYears[d.year] = S.openYears[d.year] === false; render(); return; }
  if(d.map){ S.mapMode = d.map; render(); return; }
  if(d.ev){ openDetail(d.ev); return; }
  if(d.openAdd){ openEditor(null); return; }

  if(d.tab){ S.tab = d.tab; render(); return; }

  // The sheet remains in the DOM during its close transition, so a fast tap
  // can land here after the draft is gone. Fail closed rather than throw.
  if((d.pick || d.sw || d.addcat || d.save || d.newcat) && !S.draft){ closeSheet(); return; }
  // Habits
  if(d.htog){
    const i = d.htog.lastIndexOf(':');
    const id = d.htog.slice(0, i), day = d.htog.slice(i + 1);
    if(!RX_ID.test(id) || !validDate(day)) return;
    if(day > todayISO()){ toast('That day has not happened yet'); return; }
    toggleHabit(id, day);
    // Rebuilding the whole view for one tick is what makes a tap feel slow.
    // Patch the tapped control in place; fall back to a render if it isn't
    // one of the two shapes we know how to update.
    if(!patchTick(t, id, day)) render();
    return;
  }
  if(d.hopen){
    const h = S.habits.find(x => x.id === d.hopen);
    if(!h){ toast('That habit no longer exists'); render(); return; }
    openHabitEditor(h); return;
  }
  if(d.hadd){ openHabitEditor(null); return; }
  if(d.themePick){ applyTheme(d.themePick); render(); haptic(); return; }
  if(d.hwk){
    S.hWeek = (+d.hwk === 0) ? new Date()
      : new Date(S.hWeek.getFullYear(), S.hWeek.getMonth(), S.hWeek.getDate() + (+d.hwk) * 7, 12);
    render(); return;
  }
  if(d.hmv){
    S.hCursor = (+d.hmv === 0) ? new Date()
      : new Date(S.hCursor.getFullYear(), S.hCursor.getMonth() + (+d.hmv), 1, 12);
    if(+d.hmv === 0) S.hSel = todayISO();
    render(); return;
  }
  if(d.hday){
    if(!validDate(d.hday)) return;
    S.hSel = S.hSel === d.hday ? null : d.hday;
    render(); return;
  }
  if(d.hdayPick){
    if(!S.hDraft) return;
    syncHabit();
    const i = +d.hdayPick;
    S.hDraft.days = S.hDraft.days.includes(i)
      ? S.hDraft.days.filter(x => x !== i) : [...S.hDraft.days, i].sort();
    drawHabitEditor(); return;
  }
  if(d.hcol){
    if(!S.hDraft) return;
    syncHabit(); S.hDraft.color = RX_COLOR.test(d.hcol) ? d.hcol : SWATCHES[0];
    drawHabitEditor(); return;
  }
  if(d.hsave){ saveHabit(); return; }
  if(d.hdel){ deleteHabit(d.hdel); return; }

  if(d.pick){ syncDraft(); S.draft.catId = d.pick; drawEditor(); return; }
  if(d.newcat){ $('#newCat').classList.add('on'); $('#swatches').style.display = 'flex'; $('#f-newcat').focus(); return; }
  if(d.sw){ S.draft.newColor = d.sw; document.querySelectorAll('[data-sw]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.sw === d.sw))); return; }
  if(d.addcat){
    const name = cleanText($('#f-newcat').value, CAP.name);
    if(!name){ toast('Name the category'); return; }
    if(S.cats.length >= MAX_CATS){ toast('That is as many categories as Chrono holds'); return; }
    if(S.cats.some(c => c.name.toLowerCase() === name.toLowerCase())){ toast('That one already exists'); return; }
    const c = { id:'c_' + uid(), name, color: RX_COLOR.test(S.draft.newColor) ? S.draft.newColor : SWATCHES[4] };
    S.cats.push(c); saveCats(); syncDraft(); S.draft.catId = c.id; drawEditor(); toast('Category added'); return;
  }
  if(d.save){ saveDraft(); return; }
  if(d.close){ closeSheet(); return; }
  if(d.del){ deleteEvent(d.del); return; }
  if(d.edit){
    const target = S.events.find(e => e.id === d.edit);
    if(!target){ toast('That event no longer exists'); closeSheet(); render(); return; }
    closeSheet(); setTimeout(() => openEditor(target), 260); return;
  }
  if(d.delcat){
    const c = catOf(d.delcat), n = S.events.filter(e => e.catId === d.delcat).length;
    if(n && !confirm(`${n} event(s) use "${c.name}". They will move to ${S.cats[0].name}. Continue?`)) return;
    S.events.forEach(e => { if(e.catId === d.delcat) e.catId = S.cats[0].id; });
    S.cats = S.cats.filter(x => x.id !== d.delcat);
    if(S.cat === d.delcat) S.cat = 'all';
    saveCats(); saveEvents(); render(); toast('Category removed'); return;
  }
  if(d.act){
    if(d.act === 'import') $('#fileIn').click();
    if(d.act === 'wipe'){
      if(confirm('Delete every event, diary page, intention, habit and custom category? Export a backup first — this cannot be undone.')){
        S.events = []; S.cats = DEFAULT_CATS.slice(); S.cat = 'all';
        S.journals.diary = []; S.journals.manifest = [];
        S.jPage.diary = 0; S.jPage.manifest = 0;
        S.habits = []; S.hlog = {}; bumpStats();
        S.query = ''; S.selDay = todayISO(); S.hSel = null; S.openYears = {};
        // Remove the keys outright rather than leaving empty arrays behind.
        [K_EV, K_CAT, K_HAB, JOURNALS.diary.key, JOURNALS.manifest.key].forEach(k => Store.del(k));
        render(); toast('Everything deleted');
      }
    }
    return;
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'fileIn' && e.target.files[0]){ importJSON(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('click', e => {
  const s = e.target.closest('#msToggle');
  if(!s || !S.draft) return;
  syncDraft();
  S.draft.milestone = !S.draft.milestone;
  s.setAttribute('aria-pressed', String(S.draft.milestone));
  haptic();
});
$('#fabAdd').addEventListener('click', () => {
  if(S.tab === 'habit') openHabitEditor(null);
  else if(isJournal(S.tab)) openEntryEditor(S.tab, null);
  else openEditor(null);
});
$('#exportBtn').addEventListener('click', () =>
  openExportSheet(S.tab === 'habit' ? 'habit' : isJournal(S.tab) ? S.tab : 'timeline'));


/* search wiring — the field lives outside #view so typing never loses focus */
$('#searchBtn').addEventListener('click', () => {
  S.searchOpen = !S.searchOpen;
  if(!S.searchOpen){ S.query = ''; $('#q').value = ''; }
  render();
  if(S.searchOpen) $('#q').focus();
});
$('#q').addEventListener('input', e => { S.query = e.target.value; render(); });
$('#qClear').addEventListener('click', () => {
  S.query = ''; $('#q').value = ''; render(); $('#q').focus();
});

$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* swipe between lenses */
let sx = 0, sy = 0;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
document.addEventListener('touchend', e => {
  if(!LENSES[S.tab] || S.query.trim() || $('#sheet').classList.contains('on')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
  const set = LENSES[S.tab]; if(!set) return;
  const order = set.map(x => x[0]), i = order.indexOf(S.lens[S.tab]);
  const j = dx < 0 ? Math.min(i + 1, order.length - 1) : Math.max(i - 1, 0);
  if(i !== j){ S.lens[S.tab] = order[j]; render(); haptic(); }
}, { passive:true });

load();
S.selDay = todayISO();
render();

if('serviceWorker' in navigator){
  // Scope is pinned to Chrono's own folder so the worker never intercepts
  // requests belonging to another project on this shared origin.
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => { try { reg.update(); } catch(e){} })
      .catch(()=>{});
  });
  // A cache-first worker will otherwise keep serving the old build until the
  // app is closed and reopened, which looks exactly like a fix that failed.
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloading) return;
    const sheet = document.getElementById('sheet');
    if(sheet && sheet.classList.contains('on')) return;   // never interrupt an edit
    reloading = true;
    location.reload();
  });
}
